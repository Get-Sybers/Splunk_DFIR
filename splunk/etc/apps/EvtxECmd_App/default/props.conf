#############################################################################################
# EvtxECmd output -> Splunk Add-on for Microsoft Windows field names
#
# Produced by scripts/process-evtx-EvtxECmd.sh.
#
# The point of this app is that EvtxECmd's field names are its own, not
# Splunk's. Anything written against the Splunk Add-on for Microsoft Windows
# looks for EventCode, RecordNumber, LogName, SourceName, ComputerName. This
# maps EvtxECmd's names onto those, and then onto CIM, so existing Windows
# searches, dashboards and correlation work against evtx parsed offline.
#
# The official add-on is NOT required for this to work. If you do install it
# (see data_store/dependencies/splunk_apps/), it will not conflict — it keys on
# the WinEventLog / XmlWinEventLog sourcetypes, not these.
#############################################################################################

##################################### evtxecmd:json #########################################
# The supported lane. EvtxECmd --json emits one JSON object per record.

[evtxecmd:json]
INDEXED_EXTRACTIONS = json
KV_MODE             = none
SHOULD_LINEMERGE    = false
LINE_BREAKER        = ([\r\n]+)
TRUNCATE            = 0
category            = Structured
pulldown_type       = true
disabled            = false

# EvtxECmd writes TimeCreated as ISO8601. TIME_FORMAT is deliberately not
# pinned: EvtxECmd emits 7 fractional-second digits, which does not map cleanly
# onto Splunk's %3N/%6N/%9N, and Splunk's own ISO8601 recognition handles a
# variable fraction correctly. TIMESTAMP_FIELDS already prevents it choosing
# some other timestamp in the record.
TIMESTAMP_FIELDS        = TimeCreated
MAX_TIMESTAMP_LOOKAHEAD = 40

# Events can predate the ingest by years — this is dead-box forensics.
MAX_DAYS_AGO = 10000

TRANSFORMS-evtxecmd_host = evtxecmd_set_host

# --- names used by the Splunk Add-on for Microsoft Windows --------------------
FIELDALIAS-evtxecmd_ta_names = EventId AS EventCode \
                               EventRecordId AS RecordNumber \
                               Channel AS LogName \
                               Provider AS SourceName \
                               Computer AS ComputerName \
                               UserId AS Sid \
                               UserName AS User \
                               Level AS Type

# --- Common Information Model ------------------------------------------------
# Matching the add-on's own CIM aliases: event_id/signature_id from EventCode,
# event_record_id from RecordNumber, dest from the computer name.
FIELDALIAS-evtxecmd_cim = EventId AS event_id \
                          EventId AS signature_id \
                          EventRecordId AS event_record_id \
                          Computer AS dest \
                          Computer AS dvc \
                          Computer AS dvc_nt_host \
                          Provider AS event_source \
                          Provider AS provider \
                          Level AS vendor_severity_id \
                          ProcessId AS process_id \
                          ThreadId AS thread_id \
                          UserName AS user \
                          RemoteHost AS src \
                          ExecutableInfo AS process

# MapDescription is EvtxECmd's human-readable summary, populated from its Maps/
# folder. It is the closest thing to the add-on's `signature`, and it is empty
# if EvtxECmd was run without Maps/.
EVAL-signature      = coalesce(MapDescription, "EventCode " . EventCode)
EVAL-vendor_product = "Microsoft Windows"
EVAL-vendor         = "Microsoft"
EVAL-product        = "Windows"
EVAL-app            = Channel

##################################### evtxecmd:xml ##########################################
# Best-effort lane. See the caveat in
# docs/scripts/processing_data/process-evtx-EvtxECmd.md before relying on it.
#
# EvtxECmd's ConvertPayloadToXml() beautifies its output and strips the xmlns
# declaration, so these records are NOT byte-identical to what a Windows
# forwarder emits. The official add-on's XmlWinEventLog sourcetype keys on that
# format, so it is not safe to assume this is a drop-in substitute — which is
# why it gets its own sourcetype rather than being labelled XmlWinEventLog.

[evtxecmd:xml]
SHOULD_LINEMERGE = false
# One event per record, regardless of the pretty-printing.
LINE_BREAKER     = ([\r\n]*)<Event[\s>]
KV_MODE          = xml
TRUNCATE         = 0
category         = Structured
pulldown_type    = true
disabled         = false

MAX_DAYS_AGO = 10000

TIME_PREFIX             = SystemTime=[\"']
MAX_TIMESTAMP_LOOKAHEAD = 40

# The XML uses the Windows element names, so the mapping differs from the JSON
# lane. EventID and Computer come straight out of the <System> block.
FIELDALIAS-evtxecmd_xml_ta = EventID AS EventCode \
                             Computer AS ComputerName \
                             Channel AS LogName

FIELDALIAS-evtxecmd_xml_cim = EventID AS event_id \
                              EventID AS signature_id \
                              Computer AS dest \
                              Computer AS dvc

EVAL-vendor_product = "Microsoft Windows"
