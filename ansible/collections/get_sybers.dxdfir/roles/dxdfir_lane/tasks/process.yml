---
# Shared processing skeleton for every hardened tool lane (was copy-pasted into
# each lane's tasks/process.yml). The three steps run as ONE guarded unit: on any
# failure the rescue surfaces the processor's own JSON summary + stderr as one
# clear diagnostic instead of a raw traceback, then fails the play (no
# half-configured silence). In check mode the command is skipped, so the gate on
# its output is too.
#
# The calling lane supplies: dxdfir_lane_argv (the processor command — the one
# genuinely per-lane piece), dxdfir_lane_python_path, the output dir + glob to
# verify (dxdfir_lane_verify_dir / dxdfir_lane_verify_glob), and an optional
# lane-specific output gate (dxdfir_lane_gate_extra) — a task file that asserts on
# the run's JSON summary (dxdfir_lane_run.stdout) and the verification
# (dxdfir_lane_verify).
- name: "process | run, verify and gate | {{ dxdfir_lane_name }}"
  block:
    - name: "process | run the processor | {{ dxdfir_lane_name }}"
      ansible.builtin.command:
        argv: "{{ dxdfir_lane_argv }}"
      environment:
        PYTHONPATH: "{{ dxdfir_lane_python_path }}"
      register: dxdfir_lane_run
      changed_when: (dxdfir_lane_run.stdout | from_json).processed | int > 0

    - name: "process | verify output on disk | {{ dxdfir_lane_name }}"
      ansible.builtin.find:
        paths: "{{ dxdfir_lane_verify_dir }}"
        patterns: "{{ dxdfir_lane_verify_glob }}"
        recurse: true
      register: dxdfir_lane_verify
      when: dxdfir_lane_verify_glob | length > 0

    - name: "process | assert no processor failures | {{ dxdfir_lane_name }}"
      when:
        - dxdfir_lane_run is not skipped
        - dxdfir_lane_require_no_failures | bool
      ansible.builtin.assert:
        that:
          - (dxdfir_lane_run.stdout | from_json).failed | int == 0
        fail_msg: >-
          {{ dxdfir_lane_name }} reported processor failures — see the summary above.
        quiet: true

    # Lane-specific output gate: a trusted, literal assert in the lane's own file
    # (e.g. evtx's "produced JSON unless there were no logs"), with dxdfir_lane_run +
    # dxdfir_lane_verify in scope. Kept in the lane — NOT passed as an expression
    # string — because ansible-core rejects evaluating variable-sourced templates
    # in `that:` (template-injection guard).
    - name: "process | lane output gate | {{ dxdfir_lane_name }}"
      ansible.builtin.include_tasks: "{{ dxdfir_lane_gate_extra }}"
      when:
        - dxdfir_lane_run is not skipped
        - dxdfir_lane_gate_extra | length > 0
  rescue:
    - name: "process | surface processor diagnostics | {{ dxdfir_lane_name }}"
      ansible.builtin.fail:
        msg: >-
          dxdfir_{{ dxdfir_lane_name }} processing failed.
          Summary: {{ dxdfir_lane_run.stdout | default('(no summary emitted)') | trim }}
          Stderr: {{ dxdfir_lane_run.stderr | default('') | trim | truncate(1000) }}
