#############################################################################################
# EvtxECmd transforms
#############################################################################################

# Set the Splunk host from the event's own Computer field rather than the
# indexer's hostname. Without this every parsed evtx record is attributed to the
# Splunk container, which makes host-based correlation meaningless — the same
# mistake the log2timeline path avoids with set_host_from_csv.
#
# This is index-time, so it relies on Computer being an indexed field, which it
# is via INDEXED_EXTRACTIONS = json in props.conf.
[evtxecmd_set_host]
DEST_KEY   = MetaData:Host
SOURCE_KEY = field:Computer
REGEX      = (.+)
FORMAT     = host::$1
WRITE_META = true
