---
# Pipeline-agnostic processing — identical for ADX and SOF-ELK; only the
# output base differs, resolved into dfir_zimmerman_out_dir by defaults/main.yml
# from dfir_zimmerman_pipeline.
#
# The three steps run as one guarded unit: on any failure the rescue surfaces
# the processor's own JSON summary and stderr as ONE clear diagnostic instead
# of a raw traceback, then fails the play (no half-configured silence). In
# check mode the command is skipped, so the gate on its output is too.
- name: "zimmerman-process | process, verify and gate"
  block:
    - name: "zimmerman-process | extract + run EZ-Tools over disk images / VM exports"
      ansible.builtin.command:
        argv: >-
            {{ ['python3', '-m', 'get_sybers_dfir.zimmerman',
                '--input-dir', dfir_zimmerman_input_dir,
                '--vm-dir', dfir_zimmerman_vm_dir,
                '--out-dir', dfir_zimmerman_out_dir,
                '--plaso-image', dfir_zimmerman_plaso_image]
            + (['--vss'] if dfir_zimmerman_vss | bool else [])
            + (['--force'] if dfir_zimmerman_force | bool else []) }}
      environment:
        PYTHONPATH: "{{ dfir_zimmerman_python_path }}"
      register: dfir_zimmerman_run
      changed_when: (dfir_zimmerman_run.stdout | from_json).processed | int > 0

    - name: "zimmerman-process | verify per-host output on disk"
      ansible.builtin.find:
        paths: "{{ dfir_zimmerman_out_dir }}"
        recurse: true
        file_type: file
      register: dfir_zimmerman_verify

    # Per-image "empty" (no zimmerman artefact set at all — e.g. a non-Windows
    # image) is NORMAL, not a failure; the gate is "some host produced output,
    # or there were no images / nothing but empties".
    - name: "zimmerman-process | assert output was produced for the images present"
      when: dfir_zimmerman_run is not skipped
      ansible.builtin.assert:
        that:
          - >-
            dfir_zimmerman_verify.matched | int > 0 or
            ((dfir_zimmerman_run.stdout | from_json).images | int ==
             (dfir_zimmerman_run.stdout | from_json).empty | int)
        fail_msg: >-
          zimmerman produced no output at all though disk images were present
          (every EZ-Tools container failed?).
        quiet: true
  rescue:
    - name: "zimmerman-process | surface processor diagnostics"
      ansible.builtin.fail:
        msg: >-
          dfir_zimmerman processing failed.
          Summary: {{ dfir_zimmerman_run.stdout | default('(no summary emitted)') | trim }}
          Stderr: {{ dfir_zimmerman_run.stderr | default('') | trim | truncate(1000) }}
