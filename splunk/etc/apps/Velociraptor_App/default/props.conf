#############################################################################################
#                                   Velociraptor JSON                                       #
#############################################################################################
[velociraptor:json]
MAX_DAYS_AGO = 10000
# Parsing and performance settings
INDEXED_EXTRACTIONS = JSON
KV_MODE = json
SHOULD_LINEMERGE = false
TRANSFORMS-sourcetype = extract_velociraptor_artifact
TRUNCATE = 0
# Use common timestamp fields from Velociraptor output
TIMESTAMP_FIELDS = _ts, timestamp, Mtime, Atime, Ctime, StartTime, EventTime
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%f, %s
