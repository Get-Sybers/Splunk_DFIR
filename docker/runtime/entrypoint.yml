---
# The ONLY thing a dfir/* container can execute. The image's ENTRYPOINT is
# pinned to `ansible-playbook … /opt/dfir/entrypoint.yml`, so every invocation
# runs this play and nothing else; the embedded run role allow-lists which
# binary it will execute (baked per image via DFIR_ALLOWED_ARGV0/ARGV1).
#
#   docker run … dfir/<tool> -e '{"dfir_run_argv": ["<tool>", …]}'
#   docker run … dfir/<tool> -e '{"dfir_run_verify": true}'   # hardening check
- name: DX_DFIR container runtime
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - role: dfir_run
