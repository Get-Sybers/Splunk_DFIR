---
# Repo root is five levels up from this role.
dxdfir_deploy_sofelk_repo_root: "{{ role_path }}/../../../../.."

# The from-source SOF-ELK stack (Dockerfile + docker-compose.yml) lives here.
dxdfir_deploy_sofelk_compose_dir: "{{ dxdfir_deploy_sofelk_repo_root }}/docker/sof-elk"
# Host ingest dir mounted into the stack at /logstash. Point dxdfir_ingest_sofelk's
# target_dir at the SAME path so delivery lands where SOF-ELK watches.
dxdfir_deploy_sofelk_ingest_dir: "{{ dxdfir_deploy_sofelk_repo_root }}/data_store/sofelk-delivered"
# Elastic stack version (SOF-ELK main's pin) and the SOF-ELK ref to build from.
dxdfir_deploy_sofelk_elastic_version: "9.4.3"
dxdfir_deploy_sofelk_sofelk_ref: "main"
# Build the SOF-ELK image from the Dockerfile as part of the deploy.
dxdfir_deploy_sofelk_build: true
# Runtime env file for the compose interpolation (kept under gitignored data_store).
dxdfir_deploy_sofelk_env_file: "{{ dxdfir_deploy_sofelk_repo_root }}/data_store/sofelk.env"
