# detect_outbound_smb_traffic.conf
# Detects outbound SMB connections to external servers which could indicate data exfiltration or command and control

[Detect_Outbound_SMB_Traffic]
action.email.useNSSubject = 1
alert.track = 1
alert.expires = 7d
alert.severity = 4
alert.suppressMenu = 0
alert.suppressPriority = 1
counttype = number of events
cron_schedule = 20 * * * *
description = Detects outbound SMB connections to external servers which could indicate data exfiltration or command and control
dispatch.earliest_time = -15m
dispatch.latest_time = now
display.general.timeRangePicker.show = 0
display.general.type = statistics
display.page.search.tab = statistics
display.visualizations.show = 0
enableSched = 1
quantity = 0
relation = greater than
request.ui_dispatch_app = search
request.ui_dispatch_view = search
search = index=zeek sourcetype="bro:conn:json" (id.resp_p=139 OR id.resp_p=445 OR service=smb) NOT (id.resp_h=10.0.0.0/8 OR id.resp_h=172.16.0.0/12 OR id.resp_h=192.168.0.0/16)\
        | stats count by id.orig_h, id.resp_h, id.resp_p\
        | rename id.orig_h as src_ip, id.resp_h as dest_ip, id.resp_p as dest_port\
        | table src_ip, dest_ip, dest_port, count\
        | sort -count