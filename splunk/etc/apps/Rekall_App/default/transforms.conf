#############################################################################################
#                                   ALL rekall                                               #
#############################################################################################
[extract_rekall_sourcetype]
DEST_KEY   = MetaData:Sourcetype
SOURCE_KEY = field:plugin
REGEX = ([a-zA-Z0-9_]+)
FORMAT = sourcetype::rekall:$1
WRITE_META = true


