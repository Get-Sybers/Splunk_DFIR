name: Detect_Port_Scans_Horizontal
id: 
version: 1
date: '2024-08-01'
author: Jake Badoino
status: experimental
type: anomaly
description: This detection identifies horizontal port scans by monitoring the number of unique destination ports that a single source IP tries to connect to within a specific period. Horizontal port scans can indicate reconnaissance activities where an attacker is trying to identify available services across multiple hosts in the network.
data_source: [zeek]
search: '
        index=network sourcetype="zeek:conn"
        | stats count by id.orig_h, id.resp_h, id.resp_p
        | stats dc(id.resp_p) as unique_ports by id.orig_h, id.resp_h
        | where unique_ports > 10  # Adjust threshold based on your environment
        | rename id.orig_h as "Source IP", id.resp_h as "Destination IP", unique_ports as "Unique Ports Scanned"
        | sort - "Unique Ports Scanned"'
how_to_implement: This detection identifies horizontal port scans by analyzing Zeek connection logs to count the number of unique destination ports a source IP connects to. Ensure that the threshold for unique ports is set appropriately for your environment to reduce false positives.
known_false_positives: High volumes of connections to multiple ports may be legitimate in some environments, such as during network performance testing or scanning by security tools. Regularly review and adjust the threshold value based on normal network behavior to minimize false positives.
references: []
tags:
  analytic_story:
  - Network Scanning
  - Reconnaissance
  asset_type: Network
  confidence: 70
  impact: 60
  message: Horizontal port scanning activity detected from $Source IP$ to $Destination IP$ with $Unique Ports Scanned$ unique ports.
  mitre_attack_id:
  - T1046
  observable:
  - name: Source IP
    type: IP Address
    role:
    - Attacker
  - name: Destination IP
    type: IP Address
    role:
    - Victim
  product:
  - Splunk Enterprise
  - Splunk Enterprise Security
  - Splunk Cloud
  required_fields:
  - _time
  - id.orig_h
  - id.resp_h
  - id.resp_p
  risk_score: 50
  security_domain: network
tests:
- name: True Positive Test
  attack_data:
  - data: 
    sourcetype: zeek:conn
    source: conn.log
