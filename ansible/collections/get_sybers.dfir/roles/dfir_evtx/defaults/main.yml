---
# Backend to target; the playbook overrides this to select the pipeline.
dfir_evtx_pipeline: adx

# Repo root is five levels up from this role
# (roles/dfir_evtx -> get_sybers.dfir -> collections -> ansible -> repo).
dfir_evtx_repo_root: "{{ role_path }}/../../../../.."

dfir_evtx_evtx_dir: "{{ dfir_evtx_repo_root }}/data_store/raw/other_raw_data/WinEvt"
dfir_evtx_adx_out_dir: "{{ dfir_evtx_repo_root }}/data_store/processed/windows_logs"
dfir_evtx_sofelk_out_dir: "{{ dfir_evtx_repo_root }}/data_store/processed/sofelk/windows_logs"

# Disk-image inputs (optional): a disk image (E01/raw/VMDK) or a directory of them.
# When set, WindowsEventLogs (.evtx) are extracted with log2timeline/plaso
# image_export.py into the stage dir and processed alongside dfir_evtx_evtx_dir, so
# the lane consumes images directly. Empty (default) => loose .evtx only.
dfir_evtx_image_src: ""
# Where --image-src extractions land. Per-image subdirs, reused across runs (an
# image whose logs are already staged is not re-pulled). Pinned to ONE canonical
# stage for BOTH pipelines — the same default the dfir_signatures hayabusa lane
# uses — so the adx run, the sofelk run and the detection lane all share the
# extraction instead of each re-pulling the image.
dfir_evtx_stage_dir: "{{ dfir_evtx_repo_root }}/data_store/processed/windows_logs/_extracted_evtx"
# Include Volume Shadow Copies when extracting from a disk image.
dfir_evtx_vss: false
# Container providing image_export.py for disk-image extraction (already shipped for
# the disk/signature lanes).
dfir_evtx_plaso_image: "log2timeline/plaso:latest"

# Hayabusa (Sigma detection) over the same .evtx this lane collects — loose or
# image-extracted. Enrichment: a missing binary or zero detections is a note, not a
# failure, so leaving this on is safe even without the binary provisioned.
dfir_evtx_hayabusa: true
# Dir holding the hayabusa binary (+ rules/). Empty => the processor's default,
# data_store/dependencies/hayabusa under the CWD.
dfir_evtx_hayabusa_dir: "{{ dfir_evtx_repo_root }}/data_store/dependencies/hayabusa"
# Sigma rules dir (empty => rules/ beside the binary).
dfir_evtx_hayabusa_rules: ""

# How EvtxECmd is supplied — two modes:
#   bundled  (default): the dfir/evtxecmd image (docker/evtxecmd) bakes EvtxECmd.dll
#            + Maps/. Nothing to place by hand; build it once with
#            `docker build -t dfir/evtxecmd:latest docker/evtxecmd`.
#   operator: set dfir_evtx_use_bundled_image=false and drop the .NET EvtxECmd
#            release (incl. Maps/) under dfir_evtx_evtxecmd_dir. EvtxECmd is MIT but
#            we don't vendor it; the operator supplies the build.
dfir_evtx_use_bundled_image: true
dfir_evtx_bundled_image: "dfir/evtxecmd:latest"
# Operator-supplied mode only: the release dir, and the stock .NET runtime image
# that mounts it. EvtxECmd's current build targets net9.0, so the runtime is 9.x
# (the old sdk:8.0 default silently fails against today's release).
dfir_evtx_evtxecmd_dir: "{{ dfir_evtx_repo_root }}/data_store/dependencies/evtxecmd"
dfir_evtx_dotnet_image: "mcr.microsoft.com/dotnet/runtime:9.0"

# The image the processor actually runs — bundled or the mount-into-runtime one.
# `| bool` so the string extra-var form (-e dfir_evtx_use_bundled_image=false) is
# read the same way here as in every task (a bare non-empty string is Jinja-truthy).
dfir_evtx_image: "{{ dfir_evtx_bundled_image if dfir_evtx_use_bundled_image | bool else dfir_evtx_dotnet_image }}"

# In-repo runs use PYTHONPATH; a deployed run installs the package instead.
dfir_evtx_python_path: "{{ dfir_evtx_repo_root }}/python"
dfir_evtx_force: false
