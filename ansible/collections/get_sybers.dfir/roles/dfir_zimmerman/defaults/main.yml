---
# Backend to target; the playbook overrides this to select the pipeline.
dfir_zimmerman_pipeline: elastic

# Repo root is five levels up from this role
# (roles/dfir_zimmerman -> get_sybers.dfir -> collections -> ansible -> repo).
dfir_zimmerman_repo_root: "{{ role_path }}/../../../../.."

# Disk-image tree (E01/raw/img/dd/vmdk/vhd/vhdx/aff), recursed — same input
# family dfir_plaso reads, since this lane pulls its own artefact set out of the
# same evidence images.
dfir_zimmerman_input_dir: "{{ dfir_zimmerman_repo_root }}/data_store/raw/disk_images"
# VMware VM export folders (one per VM) — optional, mirrors dfir_plaso.
dfir_zimmerman_vm_dir: "{{ dfir_zimmerman_repo_root }}/data_store/raw/VM_files"
dfir_zimmerman_elastic_out_dir: "{{ dfir_zimmerman_repo_root }}/data_store/processed/zimmerman"
dfir_zimmerman_sofelk_out_dir: "{{ dfir_zimmerman_repo_root }}/data_store/processed/sofelk/zimmerman"
# Resolved output base for the selected pipeline — consumed by
# tasks/process.yml. Override directly to send output to a custom location.
dfir_zimmerman_out_dir: "{{ dfir_zimmerman_elastic_out_dir if dfir_zimmerman_pipeline == 'elastic' else dfir_zimmerman_sofelk_out_dir }}"
# The hardened in-repo Plaso image, used for artefact extraction (image_export.py)
# and the SRUM two-step (log2timeline.py/psort.py) — build with dfir-build-images.
dfir_zimmerman_plaso_image: "dfir/plaso:latest"
# Also extract from Volume Shadow Copies during artefact extraction.
dfir_zimmerman_vss: false
# In-repo runs use PYTHONPATH; a deployed run installs the package instead.
dfir_zimmerman_python_path: "{{ dfir_zimmerman_repo_root }}/python"
dfir_zimmerman_force: false

# The processor command argv, handed to the shared dfir_lane process step. This
# is the one genuinely per-lane piece; the run/verify/gate skeleton is shared.
dfir_zimmerman_argv: >-
  {{ ['python3', '-m', 'get_sybers_dfir.zimmerman',
  '--input-dir', dfir_zimmerman_input_dir,
  '--vm-dir', dfir_zimmerman_vm_dir,
  '--out-dir', dfir_zimmerman_out_dir,
  '--plaso-image', dfir_zimmerman_plaso_image]
  + (['--vss'] if dfir_zimmerman_vss | bool else [])
  + (['--force'] if dfir_zimmerman_force | bool else []) }}
