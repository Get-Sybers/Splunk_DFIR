---
- name: "velociraptor-adx | lay out collection ZIPs into per-artefact JSON"
  ansible.builtin.command:
    argv: "{{ ['python3', '-m', 'get_sybers_dfir.velociraptor', '--raw-dir', dfir_velociraptor_raw_dir, '--out-dir', dfir_velociraptor_adx_out_dir] + (['--force'] if dfir_velociraptor_force | bool else []) }}"
  environment:
    PYTHONPATH: "{{ dfir_velociraptor_python_path }}"
  register: dfir_velociraptor_adx_run
  changed_when: (dfir_velociraptor_adx_run.stdout | from_json).processed | int > 0

- name: "velociraptor-adx | verify per-artefact JSON on disk"
  ansible.builtin.find:
    paths: "{{ dfir_velociraptor_adx_out_dir }}"
    patterns: "*.json"
    recurse: true
  register: dfir_velociraptor_adx_verify

- name: "velociraptor-adx | assert output matches what was processed"
  ansible.builtin.assert:
    that:
      - (dfir_velociraptor_adx_run.stdout | from_json).failed | int == 0
      - dfir_velociraptor_adx_verify.matched | int > 0 or (dfir_velociraptor_adx_run.stdout | from_json).collections | int == 0
    fail_msg: >-
      velociraptor reported failures, or produced no JSON though collections were present.
    quiet: true
