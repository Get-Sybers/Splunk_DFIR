---
# Shared preflight for every hardened tool lane (was copy-pasted into each lane's
# tasks/preflight.yml): fact-find + preconditions BEFORE any container runs or
# files are written. FIND FACTS -> check existence AND location.
#
# The calling lane supplies: dfir_lane_module (import-checked), the input dirs
# that must exist (dfir_lane_input_checks: [{name, path}]), the tool images to
# supply-chain-guard (dfir_lane_images), and — for lane-specific preconditions
# such as evtx's bundled/operator EvtxECmd modes — an optional
# dfir_lane_preflight_extra task file, included at the point the per-lane checks
# historically ran (after the input-dir asserts, before the module/image guards).

- name: "preflight | docker daemon reachable | {{ dfir_lane_name }}"
  ansible.builtin.command: docker version
  register: dfir_lane_docker
  changed_when: false

- name: "preflight | stat each declared input dir | {{ dfir_lane_name }}"
  ansible.builtin.stat:
    path: "{{ item.path }}"
  loop: "{{ dfir_lane_input_checks }}"
  loop_control:
    label: "{{ item.name }}"
  register: dfir_lane_input_stats

- name: "preflight | input dirs exist and are directories | {{ dfir_lane_name }}"
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isdir is defined and item.stat.isdir
    fail_msg: >-
      {{ item.item.name }} ({{ item.item.path }}) is missing or is not a directory.
    quiet: true
  loop: "{{ dfir_lane_input_stats.results }}"
  loop_control:
    label: "{{ item.item.name }}"

# Lane-specific preconditions (e.g. evtx's bundled-image vs operator-release
# checks). Runs at the same point the per-lane checks used to.
- name: "preflight | lane-specific checks | {{ dfir_lane_name }}"
  ansible.builtin.include_tasks: "{{ dfir_lane_preflight_extra }}"
  when: dfir_lane_preflight_extra | length > 0

- name: "preflight | processor module imports | {{ dfir_lane_name }}"
  ansible.builtin.command:
    argv: ["python3", "-c", "import {{ dfir_lane_module }}"]
  environment:
    PYTHONPATH: "{{ dfir_lane_python_path }}"
  register: dfir_lane_import
  changed_when: false

# Supply-chain guard: refuse to start unless every tool image about to run is a
# KNOWN hardened dfir/* image (label + uid + expected name). A substituted or
# un-hardened image stops the lane before any evidence is touched. A non-dfir
# image (e.g. an operator-supplied .NET runtime) is out of scope and passes.
- name: "preflight | tool images are known hardened dfir/* images | {{ dfir_lane_name }}"
  ansible.builtin.command:
    argv: ["python3", "-m", "get_sybers_dfir.images", "--require", "{{ item }}"]
  environment:
    PYTHONPATH: "{{ dfir_lane_python_path }}"
  loop: "{{ dfir_lane_images }}"
  register: dfir_lane_image_guard
  changed_when: false
  when: item is match('^dfir/')
