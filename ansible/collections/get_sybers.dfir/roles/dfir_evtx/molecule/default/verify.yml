---
- name: Verify
  hosts: localhost
  gather_facts: false
  vars:
    molecule_out: /tmp/dfir_evtx_molecule/out
  tasks:
    - name: "molecule-verify | find the produced EvtxECmd JSON"
      ansible.builtin.find:
        paths: "{{ molecule_out }}"
        patterns: "*_EvtxECmd_Output.json"
        recurse: true
      register: produced

    - name: "molecule-verify | assert JSON was produced under the host group"
      ansible.builtin.assert:
        that:
          - produced.matched | int > 0
          - produced.files | map(attribute='path') | select('search', '/HOST01/') | list | length > 0
        fail_msg: "no EvtxECmd JSON produced from the sample log under the host group"
        quiet: true
