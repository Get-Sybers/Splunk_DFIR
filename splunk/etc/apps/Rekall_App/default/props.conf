#############################################################################################
#                                   rekall JSON                                              #
#############################################################################################
[rekall:json]
MAX_DAYS_AGO = 10000
# Parsing and performance settings
INDEXED_EXTRACTIONS = JSON
KV_MODE = json
SHOULD_LINEMERGE = false
TRANSFORMS-sourcetype = extract_rekall_sourcetype
TRUNCATE = 0
# Use extraction_timestamp as primary timestamp
TIMESTAMP_FIELDS = extraction_timestamp, created, TimeCreated, LastRun
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%f

