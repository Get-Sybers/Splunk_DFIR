##################################### EvtxECmd (Windows Event Logs) ##########################
# Produced by scripts/process-evtx-EvtxECmd.sh from raw .evtx files.
#
# There was previously no input for Windows Event Logs at all — which is part of
# why "Splunk sees them but won't ingest them": Splunk cannot read binary .evtx,
# and nothing was monitoring the directory either way.
#
# host is set at index time from each event's own Computer field by
# EvtxECmd_App's evtxecmd_set_host transform, so it is deliberately not set here.

[monitor:///data/processed/windows_logs/**/*_EvtxECmd_Output.json]
disabled = false
index = host
sourcetype = evtxecmd:json

# Best-effort XML lane — see EvtxECmd_App/default/props.conf for why this is
# not labelled XmlWinEventLog. Disabled by default so the JSON lane is the one
# in play unless you deliberately turn this on.
[monitor:///data/processed/windows_logs/**/*_EvtxECmd_Output.xml]
disabled = true
index = host
sourcetype = evtxecmd:xml

