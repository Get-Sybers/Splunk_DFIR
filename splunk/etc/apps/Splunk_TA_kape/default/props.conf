#############################################################################################
#                                   Kape CSV's                                              #
#############################################################################################
[kape:csv]
NO_BINARY_CHECK = true
INDEXED_EXTRACTIONS = CSV
KV_MODE = none
# Call the transform that extracts the folder name from the source path.
TRANSFORMS-sourcetype = extract_kape_sourcetype


