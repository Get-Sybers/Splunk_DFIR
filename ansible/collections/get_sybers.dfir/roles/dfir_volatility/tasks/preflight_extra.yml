---
# Lane-specific volatility preflight, included by dfir_lane's shared preflight
# (after the docker + input-dir checks, before the module/image guards). The
# renderer + custom plugins belong to the PIIAT-Mem tool (the submodule); the lane
# drives it through its CLI, so the guard is "the tool runs" — which also catches
# an uninitialized submodule — not a stat of files we no longer pass.
- name: "volatility-preflight | run the PIIAT-Mem tool (--list-plugins)"
  ansible.builtin.command:
    argv: ["python3", "-m", "piiat_mem", "--list-plugins"]
  environment:
    PYTHONPATH: "{{ dfir_volatility_piiat_mem_dir }}"
  register: dfir_volatility_piiat
  changed_when: false
  failed_when: false

- name: "volatility-preflight | the PIIAT-Mem tool is runnable (submodule checked out)"
  ansible.builtin.assert:
    that:
      - dfir_volatility_piiat.rc == 0
    fail_msg: >-
      PIIAT-Mem is not runnable at {{ dfir_volatility_piiat_mem_dir }} — the submodule is
      likely not checked out. Run: git submodule update --init third_party/piiat-mem
    quiet: true
