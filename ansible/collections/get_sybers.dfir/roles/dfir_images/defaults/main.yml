---
# Repo root is five levels up from this role
# (roles/dfir_images -> get_sybers.dfir -> collections -> ansible -> repo).
dfir_images_repo_root: "{{ role_path }}/../../../../.."

# The docker/ build context — every Dockerfile COPYs the shared ansible
# hardening playbook (docker/hardening/harden.yml) from here.
dfir_images_context: "{{ dfir_images_repo_root }}/docker"

# The build-it-yourself image set. Every runtime tool container is built from
# an in-repo, ansible-hardened Dockerfile — nothing is pulled from a third
# party at runtime. Each entry: name (dir under docker/ AND the dfir/<name>
# tag) — the build is verified against the hardening contract afterwards.
dfir_images_set:
  - yara
  - suricata
  - zeek
  - volatility
  - plaso
  - evtxecmd

# Rebuild even when an image already exists (docker build cache still applies).
dfir_images_force: false
