---
# dfir_evtx: .evtx -> EvtxECmd JSON. The role GROUPS; the playbook DECIDES.
# Idempotence (skip logs whose .json output exists) lives in the Python
# processor, not in a task's `when:`. This role asserts its own input rules, then
# delegates the shared preflight + process skeleton to dfir_lane.

- name: "evtx | assert inputs"
  ansible.builtin.assert:
    that:
      - dfir_evtx_pipeline in ['elastic', 'sofelk']
      # At least one input source: loose .evtx (evtx_dir) or disk images (image_src).
      - (dfir_evtx_evtx_dir | length > 0) or (dfir_evtx_image_src | length > 0)
      # A release dir is required only in operator mode; bundled mode bakes it in.
      - dfir_evtx_use_bundled_image | bool or dfir_evtx_evtxecmd_dir | length > 0
    fail_msg: >-
      dfir_evtx needs dfir_evtx_pipeline (elastic|sofelk), an input source
      (dfir_evtx_evtx_dir or dfir_evtx_image_src), and (in operator mode)
      dfir_evtx_evtxecmd_dir.
    quiet: true
  tags: [always]

# role_path resolves to THIS role here — capture the lane-specific preflight file
# so dfir_lane includes evtx's checks (bundled/operator EvtxECmd), not its own.
- name: "evtx | resolve lane-specific task paths"
  ansible.builtin.set_fact:
    dfir_evtx_preflight_extra: "{{ role_path }}/tasks/preflight_extra.yml"
    dfir_evtx_gate_extra: "{{ role_path }}/tasks/gate_extra.yml"
  tags: [always]

# The pipeline decision (elastic|sofelk) is carried by the resolved
# dfir_evtx_out_dir default — the shared tasks are pipeline-agnostic.
- name: "evtx | run the shared tool-lane skeleton"
  ansible.builtin.include_role:
    name: dfir_lane
  vars:
    dfir_lane_name: evtx
    dfir_lane_module: get_sybers_dfir.evtx
    dfir_lane_python_path: "{{ dfir_evtx_python_path }}"
    dfir_lane_images: ["{{ dfir_evtx_image }}", "{{ dfir_evtx_plaso_image }}"]
    dfir_lane_input_checks: >-
      {{ [{'name': 'evtx dir', 'path': dfir_evtx_evtx_dir}]
         if dfir_evtx_evtx_dir | length > 0 else [] }}
    dfir_lane_argv: "{{ dfir_evtx_argv }}"
    dfir_lane_verify_dir: "{{ dfir_evtx_out_dir }}"
    dfir_lane_verify_glob: "*_EvtxECmd_Output.json"
    dfir_lane_preflight_extra: "{{ dfir_evtx_preflight_extra }}"
    dfir_lane_gate_extra: "{{ dfir_evtx_gate_extra }}"
  tags: [always]
