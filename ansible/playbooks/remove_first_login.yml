---
- name: "Create .ui_login"
  ansible.builtin.file:
    path: "{{ splunk.home }}/etc/.ui_login"
    state: touch
    modification_time: preserve
    access_time: preserve
    owner: "{{ splunk.user }}"
    group: "{{ splunk.group }}"
    mode: "0660"
  become: true
  become_user: "{{ splunk.user }}"
