---
# signatures output gate, included at the end of dxdfir_lane's process block: the
# detection lanes wrote JSONL, UNLESS a run legitimately produced nothing
# (processed == 0 — a lane with no rules/inputs). A trusted literal assert —
# dxdfir_lane_run + dxdfir_lane_verify are in scope from the shared process step.
- name: "signatures-process | assert output matches what ran"
  ansible.builtin.assert:
    that:
      - dxdfir_lane_verify.matched | int > 0 or (dxdfir_lane_run.stdout | from_json).processed | int == 0
    fail_msg: >-
      a signature lane produced detections that are not on disk.
    quiet: true
