---
# The playbook holds the decisions; the role groups, the tasks act.
- name: "DFIR | deploy the SOF-ELK stack"
  hosts: "{{ dxdfir_hosts | default('localhost') }}"
  connection: "{{ dxdfir_connection | default('local') }}"
  gather_facts: true
  tasks:
    - name: "dxdfir-deploy-sofelk | run the deploy role"
      ansible.builtin.include_role:
        name: dxdfir_deploy_sofelk
