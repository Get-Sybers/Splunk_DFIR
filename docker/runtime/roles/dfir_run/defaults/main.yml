---
# The tool invocation, exec-form. argv[0] must be on the image's baked
# allow-list (DFIR_ALLOWED_ARGV0, colon-separated); when the image also bakes
# DFIR_ALLOWED_ARGV1 and argv[0] is an interpreter, argv[1] must be one of
# those baked script paths — so `python3 -c …` or an arbitrary script can
# never run.
dfir_run_argv: []
# Working directory for the tool. Defaults to /tmp: several tools write
# housekeeping files to cwd (log2timeline's own gzip log), and /tmp is the one
# place the unprivileged runtime user can always write. zeek overrides this to
# its mounted /logs.
dfir_run_chdir: "/tmp"
# When set, the tool's stdout is written to this (mounted) path — for lanes
# that parse tool output (volatility, yara) instead of files the tool writes.
dfir_run_stdout_file: ""
# Verify mode: assert the hardening contract from inside and exit.
dfir_run_verify: false
