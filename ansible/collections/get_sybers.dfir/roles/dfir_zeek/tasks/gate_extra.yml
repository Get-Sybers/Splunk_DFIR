---
# zeek output gate, included at the end of dfir_lane's process block: Zeek
# produced JSON, UNLESS there genuinely were no captures to process
# (captures == 0). A trusted literal assert — dfir_lane_run + dfir_lane_verify
# are in scope from the shared process step.
- name: "zeek-process | assert output matches what was processed"
  ansible.builtin.assert:
    that:
      - dfir_lane_verify.matched | int > 0 or (dfir_lane_run.stdout | from_json).captures | int == 0
    fail_msg: >-
      zeek produced no JSON logs though captures were present.
    quiet: true
