---
- name: Prepare
  hosts: localhost
  gather_facts: false
  vars:
    molecule_pcaps: /tmp/dxdfir_zeek_molecule/pcaps
    molecule_out: /tmp/dxdfir_zeek_molecule/out
  tasks:
    - name: "molecule-prepare | start from a clean output dir"
      ansible.builtin.file:
        path: "{{ molecule_out }}"
        state: absent

    - name: "molecule-prepare | fixture pcap dir exists"
      ansible.builtin.file:
        path: "{{ molecule_pcaps }}"
        state: directory
        mode: "0755"

    - name: "molecule-prepare | stage the fixture capture"
      ansible.builtin.copy:
        src: files/fixture.pcap
        dest: "{{ molecule_pcaps }}/fixture.pcap"
        mode: "0644"
