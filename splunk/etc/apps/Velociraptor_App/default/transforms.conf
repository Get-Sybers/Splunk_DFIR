#############################################################################################
#                              Extract Artifact from Filename                               #
#############################################################################################
# Extract artifact name from source filename pattern
# Examples:
#   Windows.System.TaskScheduler.json -> Windows.System.TaskScheduler
#   Generic.Client.Info.json -> Generic.Client.Info
#   Custom.Artifact.Name.json -> Custom.Artifact.Name
#   Windows_Registry_UserAssist.json -> Windows_Registry_UserAssist (underscores supported)
#   Custom-Artifact-Name.json -> Custom-Artifact-Name (hyphens supported)
[extract_velociraptor_artifact]
DEST_KEY   = MetaData:Sourcetype
SOURCE_KEY = MetaData:Source
REGEX      = [\/\\]?([A-Za-z0-9._-]+)\.json$
FORMAT     = sourcetype::velociraptor:$1
WRITE_META = true
