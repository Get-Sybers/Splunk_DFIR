---
# Pipeline-agnostic processing — identical for ADX and SOF-ELK; only the
# output base differs, resolved into dfir_velociraptor_out_dir by defaults/main.yml
# from dfir_velociraptor_pipeline. (SOF-ELK delivery into its watch dir is tracked
# in #45.)
#
# The three steps run as one guarded unit: on any failure the rescue surfaces
# the processor's own JSON summary and stderr as ONE clear diagnostic instead
# of a raw traceback, then fails the play (no half-configured silence). In
# check mode the command is skipped, so the gate on its output is too.
- name: "velociraptor-process | process, verify and gate"
  block:
    - name: "velociraptor-process | lay out collection ZIPs into per-artefact JSON"
      ansible.builtin.command:
        argv: >-
            {{ ['python3', '-m', 'get_sybers_dfir.velociraptor', '--raw-dir', dfir_velociraptor_raw_dir, '--out-dir', dfir_velociraptor_out_dir]
            + (['--force'] if dfir_velociraptor_force | bool else []) }}
      environment:
        PYTHONPATH: "{{ dfir_velociraptor_python_path }}"
      register: dfir_velociraptor_run
      changed_when: (dfir_velociraptor_run.stdout | from_json).processed | int > 0

    - name: "velociraptor-process | verify per-artefact JSON on disk"
      ansible.builtin.find:
        paths: "{{ dfir_velociraptor_out_dir }}"
        patterns: "*.json"
        recurse: true
      register: dfir_velociraptor_verify

    - name: "velociraptor-process | assert output matches what was processed"
      when: dfir_velociraptor_run is not skipped
      ansible.builtin.assert:
        that:
          - (dfir_velociraptor_run.stdout | from_json).failed | int == 0
          - dfir_velociraptor_verify.matched | int > 0 or (dfir_velociraptor_run.stdout | from_json).collections | int == 0
        fail_msg: >-
          velociraptor reported failures, or produced no JSON though collections were present.
        quiet: true
  rescue:
    - name: "velociraptor-process | surface processor diagnostics"
      ansible.builtin.fail:
        msg: >-
          dfir_velociraptor processing failed.
          Summary: {{ dfir_velociraptor_run.stdout | default('(no summary emitted)') | trim }}
          Stderr: {{ dfir_velociraptor_run.stderr | default('') | trim | truncate(1000) }}
