---
# FIND FACTS -> check existence AND location -> (then DELIVER + VERIFY). No docker:
# delivery is a pure-Python file copy.

- name: "ingest-sofelk-preflight | stat the sofelk source dir"
  ansible.builtin.stat:
    path: "{{ dxdfir_ingest_sofelk_src_dir }}"
  register: dxdfir_ingest_sofelk_src_stat

- name: "ingest-sofelk-preflight | source dir exists and is a directory"
  ansible.builtin.assert:
    that:
      - dxdfir_ingest_sofelk_src_stat.stat.exists
      - dxdfir_ingest_sofelk_src_stat.stat.isdir is defined and dxdfir_ingest_sofelk_src_stat.stat.isdir
    fail_msg: >-
      dxdfir_ingest_sofelk_src_dir ({{ dxdfir_ingest_sofelk_src_dir }}) is missing or is
      not a directory — run the processors with --pipeline sofelk first.
    quiet: true

- name: "ingest-sofelk-preflight | the get_sybers_dxdfir.sofelk module imports"
  ansible.builtin.command: python3 -c "import get_sybers_dxdfir.sofelk"
  environment:
    PYTHONPATH: "{{ dxdfir_ingest_sofelk_python_path }}"
  register: dxdfir_ingest_sofelk_import
  changed_when: false
