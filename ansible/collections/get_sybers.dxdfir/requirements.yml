---
# pinned — never :latest, never a bare branch (ansible-standards infra galaxy §2).
# Installed into $DX_DFIR/.ansible/collections (ansible.cfg home=.ansible,
# collections_path leads with .ansible/collections) by scripts/setup-environment.sh.
collections:
  # the container-interaction galaxy, imported BY URL from the GoDFIR-toolz repo at
  # a pinned ref (replaces the former docker/GoDFIR-toolz git submodule). It
  # ships the godfir_run engine, godfir_images (registry pull + verify/audit) and
  # the per-image lanes; the pipeline + evidence roles delegate to it.
  - name: https://github.com/Get-Sybers/GoDFIR-toolz.git#/ansible_collections/get_sybers/godfir_run
    type: git
    # GoDFIR-toolz main @ the #119 merge: the UAC lane goes live. godaemonhunter
    # advances to v0.3.1 and gomount to v0.3.1 — gomount's `uac` package reads the
    # archive the Unix-like Artifacts Collector writes
    # (uac-<host>-<os>-<ts>.tar.gz|.tar|.zip, the host's files under `[root]/`) as an
    # image whose root volume is that tree, and godaemonhunter hunts it ON like a
    # disk image, so `dx process <case> godaemonhunter` hunts the collections under
    # data_store/raw/<case>/UAC/ beside the disk images and loose logs. gomount 0.3.1
    # also reads a hard link to a symlink as that symlink (the merged-usr systemd
    # units a real collection carries). Image releases v0.3.1, recorded in images.yml
    # by GoDFIR-toolz #118/#119:
    #   godaemonhunter sha256:99d82f3935c96d5cb2c249f29be92b72b731cce7bc15bb2e8430500df931e2cb
    #   gomount        sha256:1f3f8fee5d9f81605740d3caf71347d9f9676f34eb0328b644d17dd2dac2a041
    # byakugan stays v0.2.5. Pull every tool image by its :<release> tag, then verify
    # it against the content digest images.yml records. A commit SHA, not a release
    # tag — the collection is not tagged; move to the tag once it is cut.
    version: dae27b2dfc1e8eb446508fc1545d53e8cf5ab3ee
  - name: community.docker
    version: "3.13.10"
  # ansible.cfg enables its profile_tasks callback — a runtime dependency
  - name: ansible.posix
    version: "2.2.2"
  # dxdfir_stack's host-side TLS generation
  - name: community.crypto
    version: "2.26.9"
