---
# dfir_images: build every dfir/* tool image from its in-repo, ansible-hardened
# Dockerfile, then VERIFY the hardening contract on each. The role GROUPS; the
# playbook DECIDES which set to build (dfir_images_set).

- name: "images | assert inputs"
  ansible.builtin.assert:
    that:
      - dfir_images_set | length > 0
      - dfir_images_context | length > 0
    fail_msg: >-
      dfir_images needs a non-empty dfir_images_set and the docker/ build
      context (dfir_images_context).
    quiet: true
  tags: [always]

- name: "images | preflight"
  ansible.builtin.include_tasks:
    file: preflight.yml
    apply:
      tags: [always]
  tags: [always]

- name: "images | build + verify each image"
  ansible.builtin.include_tasks: build.yml
  loop: "{{ dfir_images_set }}"
  loop_control:
    loop_var: dfir_images_name
