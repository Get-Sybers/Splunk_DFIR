##################################### log2timeline ###########################################

[monitor:///data/processed/log2timeline/csv/*.csv]
disabled = true
# host is set at index time by TRANSFORMS-set_host in the Log2timeline_App
# props.conf ([l2t:csv]), which reads the CSV's own hostname field. This stanza
# used to carry `host = extracted_host`, which is a literal string, not a
# reference — Splunk assigned every event the host "extracted_host".
index = host
sourcetype = l2t:csv

[monitor:///data/processed/log2timeline/jsonl/*.jsonl]
disabled = true
# Was `host = extracted_host` — a literal string, not a reference. Removed so
# Splunk applies its default host rather than labelling every event
# "extracted_host". [l2t:jsonl] has no host TRANSFORMS yet; if per-event host
# is needed here, add one mirroring set_host_from_csv.
index = host
sourcetype = l2t:jsonl

