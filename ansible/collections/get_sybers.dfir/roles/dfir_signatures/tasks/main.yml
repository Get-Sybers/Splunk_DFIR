---
# dfir_signatures: YARA / Suricata / Hayabusa detection lanes -> JSONL. The role
# GROUPS; the playbook DECIDES. Idempotence (skip lanes whose output exists) lives
# in the Python processor, not in a task's `when:`. This role asserts its own input
# rules, then delegates the shared preflight + process skeleton to dfir_lane.

- name: "signatures | assert inputs"
  ansible.builtin.assert:
    that:
      - dfir_signatures_pipeline in ['elastic', 'sofelk']
      - dfir_signatures_lanes | difference(['yara', 'suricata', 'hayabusa']) | length == 0
    fail_msg: >-
      dfir_signatures needs dfir_signatures_pipeline (elastic|sofelk); dfir_signatures_lanes
      may only contain yara/suricata/hayabusa.
    quiet: true
  tags: [always]

# role_path resolves to THIS role here — capture the lane-specific gate file so
# dfir_lane includes signatures' output gate, not its own.
- name: "signatures | resolve lane-specific task paths"
  ansible.builtin.set_fact:
    dfir_signatures_gate_extra: "{{ role_path }}/tasks/gate_extra.yml"
  tags: [always]

# Per-lane inputs (rules, pcaps, evtx, images) are optional — each lane notes and
# skips when its inputs/tools are missing — so only the data_store anchor is
# declared as a required input; the pipeline decision (elastic|sofelk) is carried
# by the resolved dfir_signatures_out_dir default.
- name: "signatures | run the shared tool-lane skeleton"
  ansible.builtin.include_role:
    name: dfir_lane
  vars:
    dfir_lane_name: signatures
    dfir_lane_module: get_sybers_dfir.signatures
    dfir_lane_python_path: "{{ dfir_signatures_python_path }}"
    dfir_lane_images: ["dfir/yara:latest", "dfir/suricata:latest"]
    dfir_lane_input_checks:
      - name: data_store anchor
        path: "{{ dfir_signatures_repo_root }}/data_store"
    dfir_lane_argv: "{{ dfir_signatures_argv }}"
    dfir_lane_verify_dir: "{{ dfir_signatures_out_dir }}"
    dfir_lane_verify_glob: "*.jsonl"
    dfir_lane_gate_extra: "{{ dfir_signatures_gate_extra }}"
  tags: [always]
