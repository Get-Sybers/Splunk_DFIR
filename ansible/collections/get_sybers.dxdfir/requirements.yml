---
# pinned — never :latest, never a bare branch (ansible-standards infra galaxy §2).
# Installed into $DX_DFIR/.ansible/collections (ansible.cfg home=.ansible,
# collections_path leads with .ansible/collections) by scripts/setup-environment.sh.
collections:
  # the container-interaction galaxy, imported BY URL from the GoDFIR-toolz repo at
  # a pinned ref (replaces the former docker/GoDFIR-toolz git submodule). It
  # ships the godfir_run engine, godfir_images (registry pull + verify/audit) and
  # the per-image lanes; the pipeline + evidence roles delegate to it.
  - name: https://github.com/Get-Sybers/GoDFIR-toolz.git#/ansible_collections/get_sybers/godfir_run
    type: git
    # GoDFIR-toolz main @ the #115 merge: byakugan pinned at v0.2.5 — the
    # car-relationships lookup index, a native-Elastic ES|QL LOOKUP JOIN layer
    # over the CAR relationship graph that `byakugan load` populates
    # (car-relationships-<namespace>) alongside the logs-car.rel-* edge stream
    # (engine Byakugan #132). Released by GoDFIR-toolz #114 and its content
    # digest recorded in images.yml by #115
    # (sha256:0988d9b68f6ecec98b0d925949acf642f9c5f13ce973e608a2a70a19aede5b0e).
    # Pull every tool image by its :<release> tag, then verify it against the
    # content digest images.yml records. A commit SHA, not a release tag — the
    # collection v0.2.5 is not tagged yet; move to the tag once it is cut.
    version: d5be13e2c7018e8a01f5198de4a67744dc12cadc
  - name: community.docker
    version: "3.13.10"
  # ansible.cfg enables its profile_tasks callback — a runtime dependency
  - name: ansible.posix
    version: "2.2.2"
  # dxdfir_stack's host-side TLS generation
  - name: community.crypto
    version: "2.26.9"
