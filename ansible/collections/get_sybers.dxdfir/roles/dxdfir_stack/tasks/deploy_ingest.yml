---
# The Elastic config tree (elastic/ at the repo root, dxdfir_stack_config_dir):
# ingest pipelines, component/index templates and Kibana saved objects. The
# BODIES are data — the tree's files, deployed verbatim; this file only
# reconciles them read-first so a rerun against an unchanged tree is changed=0.
# Runs after kibana (saved objects need its API); pipelines/templates land
# before filebeat ever writes, so the streams' first document is routed.

# ---- ingest pipelines (elastic/pipelines/*.json; the name is the filename)

- name: "stack-deploy | read the live ingest pipelines"
  ansible.builtin.uri:
    url: "https://{{ dxdfir_stack_bind }}:{{ dxdfir_stack_es_port }}/_ingest/pipeline"
    ca_path: "{{ dxdfir_stack_ca_file }}"
    url_username: elastic
    url_password: "{{ dxdfir_stack_elastic_password }}"
    force_basic_auth: true
    status_code: [200]
  register: __dxdfir_stack_live_pipelines
  changed_when: false
  no_log: true

- name: "stack-deploy | converge the ingest pipelines"
  ansible.builtin.uri:
    url: >-
      https://{{ dxdfir_stack_bind }}:{{ dxdfir_stack_es_port
      }}/_ingest/pipeline/{{ item | basename | regex_replace('\.json$', '') }}
    method: PUT
    ca_path: "{{ dxdfir_stack_ca_file }}"
    url_username: elastic
    url_password: "{{ dxdfir_stack_elastic_password }}"
    force_basic_auth: true
    body_format: json
    body: "{{ lookup('ansible.builtin.file', item) | from_json }}"
    status_code: [200]
  loop: "{{ lookup('ansible.builtin.fileglob', dxdfir_stack_config_dir ~ '/pipelines/*.json', wantlist=true) | sort }}"
  loop_control:
    label: "{{ item | basename }}"
  vars:
    _name: "{{ item | basename | regex_replace('\\.json$', '') }}"
    # the cluster echoes bookkeeping fields it added itself; compare without them
    _live: >-
      {{ (__dxdfir_stack_live_pipelines['json'][_name] | default({}))
         | dict2items
         | rejectattr('key', 'in', ['version', 'deprecated', 'created_date_millis', 'modified_date_millis'])
         | items2dict }}
  when: _live != (lookup('ansible.builtin.file', item) | from_json)
  changed_when: true
  no_log: true

# ---- templates: components first (the index templates compose them)

- name: "stack-deploy | read the live component templates"
  ansible.builtin.uri:
    url: "https://{{ dxdfir_stack_bind }}:{{ dxdfir_stack_es_port }}/_component_template"
    ca_path: "{{ dxdfir_stack_ca_file }}"
    url_username: elastic
    url_password: "{{ dxdfir_stack_elastic_password }}"
    force_basic_auth: true
    status_code: [200]
  register: __dxdfir_stack_live_components
  changed_when: false
  no_log: true

- name: "stack-deploy | converge the component templates"
  ansible.builtin.uri:
    url: >-
      https://{{ dxdfir_stack_bind }}:{{ dxdfir_stack_es_port
      }}/_component_template/{{ item | basename | regex_replace('\.json$', '') }}
    method: PUT
    ca_path: "{{ dxdfir_stack_ca_file }}"
    url_username: elastic
    url_password: "{{ dxdfir_stack_elastic_password }}"
    force_basic_auth: true
    body_format: json
    body: "{{ lookup('ansible.builtin.file', item) | from_json }}"
    status_code: [200]
  loop: "{{ lookup('ansible.builtin.fileglob', dxdfir_stack_config_dir ~ '/templates/component/*.json', wantlist=true) | sort }}"
  loop_control:
    label: "{{ item | basename }}"
  vars:
    _name: "{{ item | basename | regex_replace('\\.json$', '') }}"
    # the cluster echoes bookkeeping fields it added itself; compare without them
    _live: >-
      {{ (__dxdfir_stack_live_components['json']['component_templates'] | default([])
          | selectattr('name', 'equalto', _name)
          | map(attribute='component_template') | first | default({}))
         | dict2items
         | rejectattr('key', 'in', ['version', 'deprecated', 'created_date_millis', 'modified_date_millis'])
         | items2dict }}
  when: _live != (lookup('ansible.builtin.file', item) | from_json)
  # registered: a changed component template rolls the existing streams over below
  register: __dxdfir_stack_components_converged
  changed_when: true
  no_log: true

- name: "stack-deploy | read the live index templates"
  ansible.builtin.uri:
    url: "https://{{ dxdfir_stack_bind }}:{{ dxdfir_stack_es_port }}/_index_template"
    ca_path: "{{ dxdfir_stack_ca_file }}"
    url_username: elastic
    url_password: "{{ dxdfir_stack_elastic_password }}"
    force_basic_auth: true
    status_code: [200]
  register: __dxdfir_stack_live_templates
  changed_when: false
  no_log: true

- name: "stack-deploy | converge the index templates"
  ansible.builtin.uri:
    url: >-
      https://{{ dxdfir_stack_bind }}:{{ dxdfir_stack_es_port
      }}/_index_template/{{ item | basename | regex_replace('\.json$', '') }}
    method: PUT
    ca_path: "{{ dxdfir_stack_ca_file }}"
    url_username: elastic
    url_password: "{{ dxdfir_stack_elastic_password }}"
    force_basic_auth: true
    body_format: json
    body: "{{ lookup('ansible.builtin.file', item) | from_json }}"
    status_code: [200]
  loop: "{{ lookup('ansible.builtin.fileglob', dxdfir_stack_config_dir ~ '/templates/index/*.json', wantlist=true) | sort }}"
  loop_control:
    label: "{{ item | basename }}"
  vars:
    _name: "{{ item | basename | regex_replace('\\.json$', '') }}"
    _live: >-
      {{ (__dxdfir_stack_live_templates['json']['index_templates'] | default([])
          | selectattr('name', 'equalto', _name)
          | map(attribute='index_template') | first | default({}))
         | dict2items
         | rejectattr('key', 'in', ['version', 'deprecated', 'created_date_millis', 'modified_date_millis'])
         | items2dict }}
  when: _live != (lookup('ansible.builtin.file', item) | from_json)
  register: __dxdfir_stack_templates_converged
  changed_when: true
  no_log: true

# ---- existing streams: a template applies to the backing indices created
# after it, never to the current one. So every existing stream is rolled over
# when a component or index template just changed (the new mappings and
# settings apply from the next document on), and a stream whose write index is
# not yet on the router pipeline is rolled over once whatever changed. A new
# stream needs nothing: its first backing index is created from the template.
# Documents indexed before the rollover keep what they were indexed with — a
# re-ingest (deploy_reingest.yml) is the only way to replay them, and when one
# is requested the streams are about to be deleted, so nothing is rolled over.

- name: "stack-deploy | read the existing logs-dxdfir.* data streams"
  ansible.builtin.uri:
    url: "https://{{ dxdfir_stack_bind }}:{{ dxdfir_stack_es_port }}/_data_stream/logs-dxdfir.*-*"
    ca_path: "{{ dxdfir_stack_ca_file }}"
    url_username: elastic
    url_password: "{{ dxdfir_stack_elastic_password }}"
    force_basic_auth: true
    status_code: [200, 404]
  register: __dxdfir_stack_data_streams
  changed_when: false
  no_log: true

- name: "stack-deploy | read each stream's write-index pipeline binding"
  ansible.builtin.uri:
    url: >-
      https://{{ dxdfir_stack_bind }}:{{ dxdfir_stack_es_port
      }}/{{ (item['indices'] | last)['index_name'] }}/_settings/index.default_pipeline
    ca_path: "{{ dxdfir_stack_ca_file }}"
    url_username: elastic
    url_password: "{{ dxdfir_stack_elastic_password }}"
    force_basic_auth: true
    status_code: [200]
  loop: "{{ (__dxdfir_stack_data_streams['json'] | default({}))['data_streams'] | default([]) }}"
  loop_control:
    label: "{{ item['name'] }}"
  register: __dxdfir_stack_write_settings
  changed_when: false
  no_log: true

- name: "stack-deploy | roll over the streams: all when a template changed, else those not on the router pipeline"
  ansible.builtin.uri:
    url: "https://{{ dxdfir_stack_bind }}:{{ dxdfir_stack_es_port }}/{{ item['item']['name'] }}/_rollover"
    method: POST
    ca_path: "{{ dxdfir_stack_ca_file }}"
    url_username: elastic
    url_password: "{{ dxdfir_stack_elastic_password }}"
    force_basic_auth: true
    status_code: [200]
  loop: "{{ __dxdfir_stack_write_settings['results'] | default([]) }}"
  loop_control:
    label: "{{ item['item']['name'] }}"
  vars:
    # the pipeline the tree binds to the streams (templates/component/logs-dxdfir@settings.json)
    _router: >-
      {{ (lookup('ansible.builtin.file', dxdfir_stack_config_dir ~ '/templates/component/logs-dxdfir@settings.json')
          | from_json)['template']['settings']['index']['default_pipeline'] }}
    _index: "{{ (item['item']['indices'] | last)['index_name'] }}"
    _bound: >-
      {{ ((((item['json'] | default({}))[_index] | default({}))['settings'] | default({}))['index'] | default({}))['default_pipeline']
         | default('') }}
  when:
    - not (dxdfir_stack_reingest | bool)
    - >-
      _bound != _router
      or __dxdfir_stack_components_converged is changed
      or __dxdfir_stack_templates_converged is changed
  changed_when: true
  no_log: true

# ---- Kibana spaces. Every space is a directory dashboards/<dir>/ holding a
# space.json (id, name, colour, initials, disabled features) plus its saved
# objects as *.ndjson — the DX_DFIR space (dashboards/DX_DFIR/, id `default`,
# the reserved space Kibana ships) and malcolm alike. An optional avatar image
# at spaces/<dir>/*.png is read and spliced in as the space's imageUrl. Each
# space is created when missing (the reserved `default` already exists, so it is
# only updated), updated when one of its fields differs, and its saved objects
# are imported into /s/<id>/, gated on their own content hash and on the probe
# of their first object.

- name: "stack-deploy | the Kibana spaces in the config tree"
  ansible.builtin.find:
    paths: "{{ dxdfir_stack_config_dir }}/dashboards"
    patterns: space.json
    recurse: true
    depth: 2
  register: __dxdfir_stack_space_files

- name: "stack-deploy | reconcile the Kibana spaces"
  when: __dxdfir_stack_space_files['files'] | length > 0
  block:
    # a space's avatar is an optional image at spaces/<dir>/*.png (the dir name
    # matches the dashboards/<dir>/ its space.json lives in); read it binary via
    # slurp — the file lookup decodes as text and would mangle the bytes — into
    # a data: URL keyed by dir
    - name: "stack-deploy | find the space avatar images"
      ansible.builtin.find:
        paths: "{{ dxdfir_stack_config_dir }}/spaces"
        patterns: "*.png"
        recurse: true
        depth: 2
        file_type: file
      register: __dxdfir_stack_avatar_files
      failed_when: false

    - name: "stack-deploy | read each space avatar as base64"
      ansible.builtin.slurp:
        src: "{{ item['path'] }}"
      loop: "{{ __dxdfir_stack_avatar_files['files'] | default([]) | sort(attribute='path') }}"
      loop_control:
        label: "{{ item['path'] | dirname | basename }}/{{ item['path'] | basename }}"
      register: __dxdfir_stack_avatars_slurped
      changed_when: false

    - name: "stack-deploy | map each space dir to its avatar data URL"
      ansible.builtin.set_fact:
        __dxdfir_stack_avatars: >-
          {{ __dxdfir_stack_avatars | default({})
             | combine({(item['item']['path'] | dirname | basename):
                         'data:image/png;base64,' ~ (item['content'] | trim)}) }}
      loop: "{{ __dxdfir_stack_avatars_slurped['results'] | default([]) }}"
      loop_control:
        label: "{{ item['item']['path'] | dirname | basename }}"
      changed_when: false

    - name: "stack-deploy | the spaces and their saved-object files"
      ansible.builtin.set_fact:
        __dxdfir_stack_spaces: >-
          {{ __dxdfir_stack_spaces | default([]) + [{
               'id': _space['id'], 'space': _space,
               'files': lookup('ansible.builtin.fileglob', (item['path'] | dirname) ~ '/*.ndjson', wantlist=true) | sort}] }}
      vars:
        _dir: "{{ item['path'] | dirname | basename }}"
        _space_raw: "{{ lookup('ansible.builtin.file', item['path']) | from_json }}"
        # splice the avatar in as imageUrl when spaces/<dir>/*.png exists
        _space: >-
          {{ _space_raw | combine({'imageUrl': (__dxdfir_stack_avatars | default({}))[_dir]})
             if _dir in (__dxdfir_stack_avatars | default({})) else _space_raw }}
      loop: "{{ __dxdfir_stack_space_files['files'] | sort(attribute='path') }}"
      loop_control:
        label: "{{ item['path'] | dirname | basename }}"
      changed_when: false

    - name: "stack-deploy | assemble each space's saved-objects payload"
      ansible.builtin.set_fact:
        __dxdfir_stack_space_payloads: >-
          {{ __dxdfir_stack_space_payloads | default({})
             | combine({item[0]['id']: ((__dxdfir_stack_space_payloads | default({}))[item[0]['id']] | default(''))
                                        ~ lookup('ansible.builtin.file', item[1]) ~ _nl}) }}
      vars:
        _nl: "\n"
      loop: "{{ __dxdfir_stack_spaces | subelements('files') }}"
      loop_control:
        label: "{{ item[0]['id'] }}: {{ item[1] | basename }}"
      changed_when: false

    - name: "stack-deploy | read the live spaces"
      ansible.builtin.uri:
        url: "http://{{ dxdfir_stack_bind }}:{{ dxdfir_stack_kibana_port }}/api/spaces/space/{{ item['id'] }}"
        url_username: elastic
        url_password: "{{ dxdfir_stack_elastic_password }}"
        force_basic_auth: true
        headers:
          kbn-xsrf: "true"
        status_code: [200, 404]
      loop: "{{ __dxdfir_stack_spaces }}"
      loop_control:
        label: "{{ item['id'] }}"
      register: __dxdfir_stack_spaces_live
      changed_when: false
      no_log: true

    - name: "stack-deploy | create the missing spaces"
      ansible.builtin.uri:
        url: "http://{{ dxdfir_stack_bind }}:{{ dxdfir_stack_kibana_port }}/api/spaces/space"
        method: POST
        url_username: elastic
        url_password: "{{ dxdfir_stack_elastic_password }}"
        force_basic_auth: true
        headers:
          kbn-xsrf: "true"
        body_format: json
        body: "{{ item['item']['space'] }}"
        status_code: [200]
      loop: "{{ __dxdfir_stack_spaces_live['results'] }}"
      loop_control:
        label: "{{ item['item']['id'] }}"
      when: item['status'] == 404
      changed_when: true
      no_log: true

    - name: "stack-deploy | update the spaces whose fields differ"
      ansible.builtin.uri:
        url: "http://{{ dxdfir_stack_bind }}:{{ dxdfir_stack_kibana_port }}/api/spaces/space/{{ item['item']['id'] }}"
        method: PUT
        url_username: elastic
        url_password: "{{ dxdfir_stack_elastic_password }}"
        force_basic_auth: true
        headers:
          kbn-xsrf: "true"
        body_format: json
        body: "{{ item['item']['space'] }}"
        status_code: [200]
      loop: "{{ __dxdfir_stack_spaces_live['results'] }}"
      loop_control:
        label: "{{ item['item']['id'] }}"
      vars:
        _wanted: "{{ item['item']['space'] }}"
        _keys: "{{ _wanted.keys() | list }}"
        # compare only the fields the file defines; Kibana echoes bookkeeping of its own
        _live: >-
          {{ dict(_keys | zip(_keys | map('extract', item['json'] | default({})) | map('default', '') | list)) }}
      when:
        - item['status'] == 200
        - _live != _wanted
      changed_when: true
      no_log: true

    - name: "stack-deploy | read each space's deployed saved-objects hash"
      ansible.builtin.slurp:
        src: "{{ dxdfir_stack_secrets_dir }}/kibana_saved_objects.{{ item['id'] }}.sha256"
      loop: "{{ __dxdfir_stack_spaces }}"
      loop_control:
        label: "{{ item['id'] }}"
      register: __dxdfir_stack_space_markers
      failed_when: false

    - name: "stack-deploy | probe each space's first saved object in the live kibana"
      ansible.builtin.uri:
        url: >-
          http://{{ dxdfir_stack_bind }}:{{ dxdfir_stack_kibana_port
          }}/s/{{ item['id'] }}/api/saved_objects/{{ _probe['type'] }}/{{ _probe['id'] }}
        url_username: elastic
        url_password: "{{ dxdfir_stack_elastic_password }}"
        force_basic_auth: true
        headers:
          kbn-xsrf: "true"
        status_code: [200, 404]
      vars:
        _nl: "\n"
        _probe: "{{ __dxdfir_stack_space_payloads[item['id']].split(_nl) | first | from_json }}"
      loop: "{{ __dxdfir_stack_spaces }}"
      loop_control:
        label: "{{ item['id'] }}"
      register: __dxdfir_stack_space_probe
      changed_when: false
      no_log: true

    - name: "stack-deploy | import each space's saved objects"
      ansible.builtin.uri:
        url: >-
          http://{{ dxdfir_stack_bind }}:{{ dxdfir_stack_kibana_port
          }}/s/{{ item['item']['id'] }}/api/saved_objects/_import?overwrite=true
        method: POST
        url_username: elastic
        url_password: "{{ dxdfir_stack_elastic_password }}"
        force_basic_auth: true
        headers:
          kbn-xsrf: "true"
        body_format: form-multipart
        body:
          file:
            content: "{{ __dxdfir_stack_space_payloads[item['item']['id']] }}"
            filename: "{{ item['item']['id'] }}-saved-objects.ndjson"
            mime_type: application/ndjson
        status_code: [200]
      loop: "{{ __dxdfir_stack_space_probe['results'] }}"
      loop_control:
        label: "{{ item['item']['id'] }}"
      vars:
        _marker: >-
          {{ (__dxdfir_stack_space_markers['results'] | selectattr('item.id', 'equalto', item['item']['id'])
              | first)['content'] | default('') | b64decode | trim }}
      register: __dxdfir_stack_space_import
      failed_when: >-
        __dxdfir_stack_space_import['status'] != 200
        or not (__dxdfir_stack_space_import['json']['success'] | default(false))
      when: >-
        item['status'] == 404
        or _marker != (__dxdfir_stack_space_payloads[item['item']['id']] | hash('sha256'))
      changed_when: true
      no_log: true

    - name: "stack-deploy | record each space's deployed saved-objects hash"
      ansible.builtin.copy:
        content: "{{ __dxdfir_stack_space_payloads[item['id']] | hash('sha256') }}"
        dest: "{{ dxdfir_stack_secrets_dir }}/kibana_saved_objects.{{ item['id'] }}.sha256"
        mode: "0640"
      loop: "{{ __dxdfir_stack_spaces }}"
      loop_control:
        label: "{{ item['id'] }}"
      changed_when: false
