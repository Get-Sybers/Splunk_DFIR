[Detect_ICMP_Scans_Ping_Sweeps]
action.webhook.enable_allowlist = 0
alert.digest_mode = 0
alert.suppress = 0
alert.track = 1
cron_schedule = * * * * *
description = his detection identifies potential network discovery activities by monitoring ICMP echo requests (ping) that exceed a certain threshold, indicating possible reconnaissance attempts.
disabled = 1
dispatch.earliest_time = rt
dispatch.latest_time = rt
display.events.fields = ["host","source","sourcetype","date","datetime","description","description_short","display_name","extracted_host","extracted_source","filename","extracted_sourcetype","hostname","index","inode","linecount","macb","message","punct","message_short","timezone","user","username","zone","processorArchitecture","version","publicKeyToken","scope","language","Version","versionScope","Culture","PublicKeyToken","chrome_url","crx_id","crx_name","crx_path","original_message","source_long","timestamp_desc","time","tag","LastWriteTimestamp","timestamp","kape_source_rest","kape_source_short","Computer","Channel","EventRecordId","ProcessId","EventId","Provider","ThreadId","Payload","answers","analyzers","id_orig_h","id_orig_p","id_resp_h","id_resp_p","uid","query"]
display.general.type = statistics
display.page.search.mode = verbose
display.page.search.tab = statistics
enableSched = 1
request.ui_dispatch_app = DETECT
request.ui_dispatch_view = search
search = index=network sourcetype="zeek:icmp" type=8\
  | bucket _time span=1h\
  | stats \
      count as ping_count,\
      dc(id_resp_h) as unique_destinations,\
      values(id_resp_h) as destination_ips\
      by _time, id_orig_h\
  | eventstats avg(ping_count) as avg_pings, stdev(ping_count) as std_pings\
  | eval threshold = avg_pings + (std_pings * 2)\
  | eval anomaly_score = round((ping_count / threshold), 2)\
  | where ping_count > threshold AND ping_count > 50\
  | eval severity = case(\
      anomaly_score >= 5, "Critical",\
      anomaly_score >= 3, "High",\
      anomaly_score >= 2, "Medium",\
      1==1, "Low")\
  | table _time, id_orig_h, ping_count, unique_destinations, anomaly_score, severity, destination_ips\
  | sort -anomaly_score

[Detect_Network Sweep Behavior]
action.webhook.enable_allowlist = 0
alert.digest_mode = 0
alert.suppress = 0
alert.track = 1
cron_schedule = * * * * *
description = This detection identifies potential network discovery activities by monitoring ICMP echo requests (ping) that exceed a certain threshold, indicating possible reconnaissance attempts.
disabled = 1
dispatch.earliest_time = rt
dispatch.latest_time = rt
display.events.fields = ["host","source","sourcetype","date","datetime","description","description_short","display_name","extracted_host","extracted_source","filename","extracted_sourcetype","hostname","index","inode","linecount","macb","message","punct","message_short","timezone","user","username","zone","processorArchitecture","version","publicKeyToken","scope","language","Version","versionScope","Culture","PublicKeyToken","chrome_url","crx_id","crx_name","crx_path","original_message","source_long","timestamp_desc","time","tag","LastWriteTimestamp","timestamp","kape_source_rest","kape_source_short","Computer","Channel","EventRecordId","ProcessId","EventId","Provider","ThreadId","Payload","answers","analyzers","id_orig_h","id_orig_p","id_resp_h","id_resp_p","uid","query"]
display.general.type = statistics
display.page.search.mode = verbose
display.page.search.tab = statistics
enableSched = 1
request.ui_dispatch_app = DETECT
request.ui_dispatch_view = search
search = index=network sourcetype="zeek:icmp" type=8\
  | bucket _time span=10m\
  | stats \
      count as ping_count,\
      dc(id_resp_h) as unique_destinations,\
      values(id_resp_h) as scanned_ips\
      by _time, id_orig_h\
  | where unique_destinations > 20 AND ping_count > unique_destinations\
  | eval sweep_ratio = round((unique_destinations / ping_count), 2)\
  | eval sweep_score = case(\
      unique_destinations > 100, "Critical_Sweep",\
      unique_destinations > 50, "High_Sweep", \
      unique_destinations > 20, "Medium_Sweep",\
      1==1, "Low_Sweep")\
  | table _time, id_orig_h, ping_count, unique_destinations, sweep_ratio, sweep_score, scanned_ips\
  | sort -unique_destinations