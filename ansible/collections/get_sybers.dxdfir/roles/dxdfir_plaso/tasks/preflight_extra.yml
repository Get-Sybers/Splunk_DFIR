---
# Lane-specific plaso preflight, included by dxdfir_lane's shared preflight (after
# the docker + input-dir checks, before the module/image guards): the custom
# psort output module (l2t_json_dxdfir) must be present on disk — it is mounted
# into psort, so a missing file fails the run late otherwise.
- name: "plaso-preflight | stat the l2t_json_dxdfir output module"
  ansible.builtin.stat:
    path: "{{ dxdfir_plaso_module }}"
  register: dxdfir_plaso_module_stat

- name: "plaso-preflight | the output module file is present"
  ansible.builtin.assert:
    that:
      - dxdfir_plaso_module_stat.stat.exists
      - dxdfir_plaso_module_stat.stat.isreg is defined and dxdfir_plaso_module_stat.stat.isreg
    fail_msg: >-
      l2t_json_dxdfir output module not found at {{ dxdfir_plaso_module }}.
    quiet: true
