name: Detect_Port_Scans_Vertical
id: 
version: 1
date: '2024-08-01'
author: Jake Badoino
status: experimental
type: anomaly
description: This detection identifies vertical port scans by monitoring the number of unique destination hosts that a single source IP tries to connect to on a specific port within a specific period. Vertical port scans can indicate reconnaissance activities where an attacker is trying to identify available services on a single port across multiple hosts in the network.
data_source: [zeek]
search: '
        index=network sourcetype="zeek:conn"
        | stats count by id.orig_h, id.resp_p
        | stats dc(id.resp_h) as unique_hosts by id.orig_h, id.resp_p
        | where unique_hosts > 10  # Adjust threshold based on your environment
        | rename id.orig_h as "Source IP", id.resp_p as "Destination Port", unique_hosts as "Unique Hosts Scanned"
        | sort - "Unique Hosts Scanned"'
how_to_implement: This detection identifies vertical port scans by analyzing Zeek connection logs to count the number of unique destination hosts a source IP connects to on a specific port. Ensure that the threshold for unique hosts is set appropriately for your environment to reduce false positives.
known_false_positives: High volumes of connections to a single port across multiple hosts may be legitimate in some environments, such as during network performance testing or scanning by security tools. Regularly review and adjust the threshold value based on normal network behavior to minimize false positives.
references: []
tags:
  analytic_story:
  - Network Scanning
  - Reconnaissance
  asset_type: Network
  confidence: 70
  impact: 60
  message: Vertical port scanning activity detected from $Source IP$ on port $Destination Port$ with $Unique Hosts Scanned$ unique hosts.
  mitre_attack_id:
  - T1046
  observable:
  - name: Source IP
    type: IP Address
    role:
    - Attacker
  - name: Destination Port
    type: Port
    role:
    - Victim
  product:
  - Splunk Enterprise
  - Splunk Enterprise Security
  - Splunk Cloud
  required_fields:
  - _time
  - id.orig_h
  - id.resp_h
  - id.resp_p
  risk_score: 50
  security_domain: network
tests:
- name: True Positive Test
  attack_data:
  - data: 
    sourcetype: zeek:conn
    source: conn.log
