# detect_port_scans_vertical.conf
# Identifies vertical port scans by monitoring unique destination hosts per port

[Detect_Port_Scans_Vertical]
action.email.useNSSubject = 1
alert.track = 1
alert.expires = 7d
alert.severity = 4
alert.suppressMenu = 0
alert.suppressPriority = 1
counttype = number of events
cron_schedule = 25 * * * *
description = Identifies vertical port scans by monitoring unique destination hosts per port
dispatch.earliest_time = -15m
dispatch.latest_time = now
display.general.timeRangePicker.show = 0
display.general.type = statistics
display.page.search.tab = statistics
display.visualizations.show = 0
enableSched = 1
quantity = 0
relation = greater than
request.ui_dispatch_app = search
request.ui_dispatch_view = search
search = index=zeek sourcetype="bro:conn:json"\
        | stats count by id.orig_h, id.resp_p\
        | stats dc(id.resp_h) as unique_hosts by id.orig_h, id.resp_p\
        | where unique_hosts > 10\
        | rename id.orig_h as "Source IP", id.resp_p as "Destination Port", unique_hosts as "Unique Hosts Scanned"\
        | sort - "Unique Hosts Scanned"