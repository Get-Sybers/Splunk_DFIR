# baseline_login_hours.conf
# Creates baseline of usual login hours per domain from Kerberos logs

[Baseline_Login_Hours]
action.email.useNSSubject = 1
alert.track = 0
cron_schedule = 0 1 * * *
description = Creates baseline of usual login hours per domain from Kerberos logs
dispatch.earliest_time = -7d@d
dispatch.latest_time = now
display.general.timeRangePicker.show = 0
display.general.type = statistics
display.page.search.tab = statistics
display.visualizations.show = 0
enableSched = 1
request.ui_dispatch_app = search
request.ui_dispatch_view = search
search = index=bro sourcetype=bro_kerberos client!="" success=true\
| rex field=client (?<DomainName>"[^\/]([^/]+)$")\
| eval DomainName=upper(DomainName)\
| eval Day=strftime(_time, "%D")\
| eval Hour=strftime(_time, "%H")\
| stats count by Day Hour DomainName\
| dedup Day Hour DomainName\
| sort Day DomainName Hour\
| stats avg(count) as AvgHourlyAuths by DomainName\
| eval HourlyThreshold=(AvgHourlyAuths*0.3)\
| table DomainName AvgHourlyAuths HourlyThreshold\
| outputlookup Base-HourlyThreshold.csv;\
\
index=bro  sourcetype=bro_kerberos client!="" success=true\
| rex field=client (?<DomainName>"[^\/]([^/]+)$")\
| eval DomainName=upper(DomainName)\
| eval Day=strftime(_time, "%D")\
| eval Hour=strftime(_time, "%H:00")\
| stats count by Day Hour DomainName\
| lookup Base-HourlyThreshold.csv DomainName\
| eval IsUsualHour=if(count>HourlyThreshold, 1, 0)\
| dedup Hour DomainName IsUsualHour\
| sort DomainName Day Hour\
| outputlookup Base-UsualLoginHours.csv