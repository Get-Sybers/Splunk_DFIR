---
- name: Converge
  hosts: localhost
  gather_facts: true
  vars:
    dfir_plaso_pipeline: elastic
    dfir_plaso_input_dir: /tmp/dfir_plaso_molecule/in
    dfir_plaso_vm_dir: /tmp/dfir_plaso_molecule/vm
    dfir_plaso_elastic_out_dir: /tmp/dfir_plaso_molecule/out
  tasks:
    - name: "converge | run dfir_plaso (elastic)"
      ansible.builtin.include_role:
        name: get_sybers.dfir.dfir_plaso
