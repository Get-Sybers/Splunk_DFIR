---
# plaso output gate, included at the end of dxdfir_lane's process block: some
# timeline was produced, UNLESS there genuinely were no sources (processed +
# skipped == 0 — an ambiguous VM descriptor is a warning, not a failure).
# Per-image failures are tolerated by the shell (dxdfir_lane_require_no_failures is
# false for this lane), so this gates purely on output. A trusted literal assert —
# dxdfir_lane_run + dxdfir_lane_verify are in scope from the shared process step.
- name: "plaso-process | assert a timeline was produced for the sources present"
  ansible.builtin.assert:
    that:
      - >-
        dxdfir_lane_verify.matched | int > 0 or
        ((dxdfir_lane_run.stdout | from_json).processed | int +
         (dxdfir_lane_run.stdout | from_json).skipped | int) == 0
    fail_msg: >-
      plaso produced no JSONL at all though disk images / VM exports were present.
    quiet: true
