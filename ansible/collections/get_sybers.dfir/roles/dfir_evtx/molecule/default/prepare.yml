---
# EvtxECmd is operator-supplied (not redistributable) and a .evtx is binary, so no
# fixture ships in-repo. Point these at a sample log and an EvtxECmd release to run
# the scenario:
#   molecule test -- -e molecule_sample_evtx=/path/Security.evtx \
#                     -e molecule_evtxecmd_dir=/path/to/evtxecmd
- name: Prepare
  hosts: localhost
  gather_facts: false
  vars:
    molecule_evtx_in: /tmp/dfir_evtx_molecule/in
    molecule_out: /tmp/dfir_evtx_molecule/out
    molecule_sample_evtx: ""
    molecule_evtxecmd_dir: ""
  tasks:
    - name: "molecule-prepare | require a sample .evtx and an EvtxECmd release"
      ansible.builtin.assert:
        that:
          - molecule_sample_evtx | length > 0
          - molecule_evtxecmd_dir | length > 0
        fail_msg: >-
          Provide -e molecule_sample_evtx=<path/to/*.evtx> and
          -e molecule_evtxecmd_dir=<path/to/evtxecmd> (operator-supplied; not shipped).
        quiet: true

    - name: "molecule-prepare | start from a clean output dir"
      ansible.builtin.file:
        path: "{{ molecule_out }}"
        state: absent

    - name: "molecule-prepare | evtx input dir exists"
      ansible.builtin.file:
        path: "{{ molecule_evtx_in }}/HOST01"
        state: directory
        mode: "0755"

    - name: "molecule-prepare | stage the sample .evtx"
      ansible.builtin.copy:
        src: "{{ molecule_sample_evtx }}"
        dest: "{{ molecule_evtx_in }}/HOST01/Security.evtx"
        mode: "0644"
