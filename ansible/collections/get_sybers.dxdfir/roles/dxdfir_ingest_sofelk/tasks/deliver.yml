---
- name: "ingest-sofelk | deliver processed sofelk output into the watch dir"
  ansible.builtin.command:
    argv: >-
      {{ ['python3', '-m', 'get_sybers_dxdfir.sofelk', '--src-dir', dxdfir_ingest_sofelk_src_dir, '--target-dir', dxdfir_ingest_sofelk_target_dir]
      + (['--force'] if dxdfir_ingest_sofelk_force | bool else []) }}
  environment:
    PYTHONPATH: "{{ dxdfir_ingest_sofelk_python_path }}"
  register: dxdfir_ingest_sofelk_run
  changed_when: (dxdfir_ingest_sofelk_run.stdout | from_json).delivered | int > 0

- name: "ingest-sofelk | verify files landed in the watch dir"
  ansible.builtin.find:
    paths: "{{ dxdfir_ingest_sofelk_target_dir }}"
    recurse: true
  register: dxdfir_ingest_sofelk_verify

- name: "ingest-sofelk | assert delivery matched what was found"
  ansible.builtin.assert:
    that:
      - (dxdfir_ingest_sofelk_run.stdout | from_json).failed | int == 0
      - dxdfir_ingest_sofelk_verify.matched | int > 0 or (dxdfir_ingest_sofelk_run.stdout | from_json).found | int == 0
    fail_msg: >-
      sofelk delivery reported failures, or delivered nothing though source files were present.
    quiet: true
