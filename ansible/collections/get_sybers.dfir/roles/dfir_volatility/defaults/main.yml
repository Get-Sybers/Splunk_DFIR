---
# Backend to target; the playbook overrides this to select the pipeline.
dfir_volatility_pipeline: adx

# Repo root is five levels up from this role
# (roles/dfir_volatility -> get_sybers.dfir -> collections -> ansible -> repo).
dfir_volatility_repo_root: "{{ role_path }}/../../../../.."

dfir_volatility_memory_dir: "{{ dfir_volatility_repo_root }}/data_store/raw/memory"
dfir_volatility_adx_out_dir: "{{ dfir_volatility_repo_root }}/data_store/processed/volatility"
dfir_volatility_sofelk_out_dir: "{{ dfir_volatility_repo_root }}/data_store/processed/sofelk/volatility"
# Resolved output base for the selected pipeline — consumed by
# tasks/process.yml. Override directly to send output to a custom location.
dfir_volatility_out_dir: "{{ dfir_volatility_adx_out_dir if dfir_volatility_pipeline == 'adx' else dfir_volatility_sofelk_out_dir }}"
# Kernel symbol cache (passed as --symbols-dir). Windows plugins fetch ISF tables from
# the symbol servers on first use — pre-seed this on an isolated host.
dfir_volatility_symbols_dir: "{{ dfir_volatility_repo_root }}/data_store/dependencies/volatility3-symbols"
# The PIIAT-Mem submodule (third_party/piiat-mem) is the standalone Volatility tool
# the lane drives via its CLI; it owns the runner, renderer and custom plugins. This
# path is put on PYTHONPATH so `python -m piiat_mem` resolves (preflight guard).
dfir_volatility_piiat_mem_dir: "{{ dfir_volatility_repo_root }}/third_party/piiat-mem"
# The hardened in-repo image (build with playbooks/dfir-build-images.yml).
dfir_volatility_image: "dfir/volatility:latest"
# Allow the container network access for ISF symbol fetch — the ONE legitimate
# network need; default fully offline (pre-seed the symbols dir instead).
dfir_volatility_symbols_online: false
# In-repo runs use PYTHONPATH; a deployed run installs the package instead.
dfir_volatility_python_path: "{{ dfir_volatility_repo_root }}/python"
dfir_volatility_force: false
