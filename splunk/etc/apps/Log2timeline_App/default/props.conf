# Needs tuning
# sourcetype!=l2t:Chrome sourcetype!=l2t:Registry sourcetype!=l2t:WinEVTX

#############################################################################################
#                                        CSV                                               #
############################################################################################
[l2t:csv]
MAX_DAYS_AGO = 10000
INDEXED_EXTRACTIONS = csv
LINE_BREAKER = ([\r\n]+)
category = Custom
SHOULD_LINEMERGE = false
NO_BINARY_CHECK = true
KV_MODE = csv
TIMESTAMP_FIELDS = datetime
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%f%z
TRUNCATE = 0
MAX_EVENTS = 0
TRANSFORMS-set_host = set_host_from_csv
TRANSFORMS-set_sourcetype = set_sourcetype_from_csv
EVAL-host = upper(host)

##################################### l2t:winevtx ###########################################
[l2t:WinEVTX]
MAX_DAYS_AGO = 10000
INDEXED_EXTRACTIONS = csv
LINE_BREAKER = ([\r\n]+)
category = Custom
KV_MODE = CSV
SHOULD_LINEMERGE = false
NO_BINARY_CHECK = true
TIMESTAMP_FIELDS = datetime
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%f%z
TRUNCATE = 0
MAX_EVENTS = 0
EVAL-host = upper(host)
REPORT-winevtx_fields = dynamic_field_extraction
REPORT-winevtx_fields = winevent_source_extraction, computer_name_extraction, event_id_extraction, provider_extraction, subject_security_id_extraction, subject_account_name_extraction, subject_account_domain_extraction, subject_logon_id_extraction, logon_type_extraction, impersonation_level_extraction, logon_security_id_extraction, logon_account_name_extraction, logon_account_domain_extraction, logon_logon_id_extraction, logon_guid_extraction, process_id_extraction, process_name_extraction, workstation_name_extraction, source_network_address_extraction, source_port_extraction, logon_process_extraction, auth_package_extraction, transited_services_extraction, package_name_extraction, key_length_extraction
EVAL-provider = replace(provider, " ", "_")



##################################### l2t:Chrome ###########################################
[l2t:Chrome]
MAX_DAYS_AGO = 10000
INDEXED_EXTRACTIONS = csv
LINE_BREAKER = ([\r\n]+)
category = Custom
KV_MODE = none
SHOULD_LINEMERGE = false
NO_BINARY_CHECK = true
TIMESTAMP_FIELDS = datetime
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%f%z
TRUNCATE = 0
MAX_EVENTS = 0
EVAL-host = upper(host)


