---
# dfir_plaso: disk images / VM exports -> enriched Plaso JSONL. The role GROUPS; the
# playbook DECIDES. Idempotence (skip images with a .plaso db + recorded output)
# lives in the Python processor, not in a task's `when:`. This role asserts its own
# input rules, then delegates the shared preflight + process skeleton to dfir_lane.
# Per-image failures are tolerated (dfir_lane_require_no_failures=false), so the
# gate is purely "some timeline was produced, or there were no sources".

- name: "plaso | assert inputs"
  ansible.builtin.assert:
    that:
      - dfir_plaso_pipeline in ['elastic', 'sofelk']
      - dfir_plaso_input_dir | length > 0
    fail_msg: >-
      dfir_plaso needs dfir_plaso_pipeline (elastic|sofelk) and a non-empty
      dfir_plaso_input_dir.
    quiet: true
  tags: [always]

# role_path resolves to THIS role here — capture the lane-specific preflight +
# gate files so dfir_lane includes plaso's checks (l2t_json output module) and
# output gate, not its own.
- name: "plaso | resolve lane-specific task paths"
  ansible.builtin.set_fact:
    dfir_plaso_preflight_extra: "{{ role_path }}/tasks/preflight_extra.yml"
    dfir_plaso_gate_extra: "{{ role_path }}/tasks/gate_extra.yml"
  tags: [always]

# The pipeline decision (elastic|sofelk) is carried by the resolved
# dfir_plaso_out_dir default — the shared tasks are pipeline-agnostic. Only the
# disk-image input dir is required; dfir_plaso_vm_dir is optional (the processor
# tolerates its absence) so it is not declared as an input check.
- name: "plaso | run the shared tool-lane skeleton"
  ansible.builtin.include_role:
    name: dfir_lane
  vars:
    dfir_lane_name: plaso
    dfir_lane_module: get_sybers_dfir.plaso
    dfir_lane_python_path: "{{ dfir_plaso_python_path }}"
    dfir_lane_images: ["{{ dfir_plaso_image }}"]
    dfir_lane_input_checks:
      - name: disk-image input dir
        path: "{{ dfir_plaso_input_dir }}"
    dfir_lane_argv: "{{ dfir_plaso_argv }}"
    dfir_lane_verify_dir: "{{ dfir_plaso_out_dir }}/jsonl"
    dfir_lane_verify_glob: "*.jsonl"
    dfir_lane_require_no_failures: false
    dfir_lane_preflight_extra: "{{ dfir_plaso_preflight_extra }}"
    dfir_lane_gate_extra: "{{ dfir_plaso_gate_extra }}"
  tags: [always]
