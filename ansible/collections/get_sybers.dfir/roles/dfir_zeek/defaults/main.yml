---
# Backend to target; the playbook overrides this to select the pipeline.
dfir_zeek_pipeline: elastic

# Repo root is five levels up from this role
# (roles/dfir_zeek -> get_sybers.dfir -> collections -> ansible -> repo).
dfir_zeek_repo_root: "{{ role_path }}/../../../../.."

dfir_zeek_pcap_dir: "{{ dfir_zeek_repo_root }}/data_store/raw/pcaps"
dfir_zeek_elastic_out_dir: "{{ dfir_zeek_repo_root }}/data_store/processed/zeek"
dfir_zeek_sofelk_out_dir: "{{ dfir_zeek_repo_root }}/data_store/processed/sofelk/zeek"
# Resolved output base for the selected pipeline — consumed by
# tasks/process.yml. Override directly to send output to a custom location.
dfir_zeek_out_dir: "{{ dfir_zeek_elastic_out_dir if dfir_zeek_pipeline == 'elastic' else dfir_zeek_sofelk_out_dir }}"
# The hardened in-repo image (build with playbooks/dfir-build-images.yml).
dfir_zeek_image: "dfir/zeek:latest"
# In-repo runs use PYTHONPATH; a deployed run installs the package instead.
dfir_zeek_python_path: "{{ dfir_zeek_repo_root }}/python"
dfir_zeek_force: false

# The processor command argv, handed to the shared dfir_lane process step. This
# is the one genuinely per-lane piece; the run/verify/gate skeleton is shared.
dfir_zeek_argv: >-
  {{ ['python3', '-m', 'get_sybers_dfir.zeek', '--pcap-dir', dfir_zeek_pcap_dir, '--out-dir', dfir_zeek_out_dir, '--image', dfir_zeek_image]
  + (['--force'] if dfir_zeek_force | bool else []) }}
