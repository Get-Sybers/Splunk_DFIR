---
# evtx output gate, included at the end of dfir_lane's process block: EvtxECmd
# produced JSON, UNLESS there genuinely were no logs to process (files == 0). A
# trusted literal assert — dfir_lane_run + dfir_lane_verify are in scope from the
# shared process step.
- name: "evtx-process | assert output matches what was processed"
  ansible.builtin.assert:
    that:
      - dfir_lane_verify.matched | int > 0 or (dfir_lane_run.stdout | from_json).files | int == 0
    fail_msg: >-
      evtx produced no JSON though logs were present.
    quiet: true
