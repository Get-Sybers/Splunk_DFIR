---
# In-image hardening — executed BY ANSIBLE INSIDE each dfir/* image build
# (`ansible-playbook -c local`), then squashed into a fresh final stage.
#
# BUILD-TIME hardener only: ansible strips the image here, then each Dockerfile
# REMOVES ansible (and, where the tool doesn't need them, the shell and python)
# in the same stage and squashes to a minimal final image whose ENTRYPOINT is
# the tool itself. Ansible never ships in the runtime image. What this does:
#
#   - the uid-0 account is RENAMED to `ansible`, password-locked, nologin —
#     there is no `root` login name and no way to become uid 0
#   - sudo/su/pkexec and the account-manipulation setuid suite are REMOVED,
#     and every remaining setuid/setgid bit is stripped
#   - package managers and pip are removed (nothing installable at runtime)
#   - the tool runs as the fixed unprivileged user (USER 2000:2000)
#
# Contract verified after every build by the dfir_images role (static image
# config + a `docker export` scan proving the removed binaries are absent).
#
# Vars (passed with -e from each Dockerfile):
#   harden_user            runtime user name         (default dfir)
#   harden_uid             fixed uid/gid             (default 2000)
#   harden_remove_pkg_mgr  remove apt/dpkg + pip     (default true)
#   harden_extra_remove    image-specific paths to delete (default [])
- name: Harden the image filesystem
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    harden_user: dfir
    harden_uid: 2000
    harden_remove_pkg_mgr: true
    harden_extra_remove: []
  tasks:
    - name: "harden | runtime group exists with a fixed gid"
      ansible.builtin.group:
        name: "{{ harden_user }}"
        gid: "{{ harden_uid }}"

    - name: "harden | runtime user exists with a fixed uid and no login shell"
      ansible.builtin.user:
        name: "{{ harden_user }}"
        uid: "{{ harden_uid }}"
        group: "{{ harden_user }}"
        shell: /usr/sbin/nologin
        create_home: true
        home: "/home/{{ harden_user }}"
        password: "!"

    # Splunk-docker posture: no `root` login name exists; the superuser slot is
    # the (locked) provisioning identity `ansible`. usermod refuses to rename
    # the account that owns the build's PID 1, so the account database is
    # edited directly — which is the point: ansible owns the change.
    - name: "harden | rename the uid-0 account to 'ansible' (nologin) in passwd"
      ansible.builtin.replace:
        path: /etc/passwd
        regexp: '^root:([^:]*):0:0:[^:]*:([^:]*):.*$'
        replace: 'ansible:\1:0:0:ansible:\2:/usr/sbin/nologin'

    - name: "harden | lock the uid-0 account in shadow"
      ansible.builtin.replace:
        path: /etc/shadow
        regexp: '^root:[^:]*:'
        replace: 'ansible:!:'

    - name: "harden | rename the gid-0 group to 'ansible'"
      ansible.builtin.replace:
        path: "{{ item }}"
        regexp: '^root:'
        replace: 'ansible:'
      loop:
        - /etc/group
        - /etc/gshadow
      failed_when: false

    - name: "harden | remove privilege-escalation and account-manipulation binaries"
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /usr/bin/sudo
        - /usr/bin/su
        - /bin/su
        - /usr/bin/pkexec
        - /usr/bin/passwd
        - /usr/bin/chsh
        - /usr/bin/chfn
        - /usr/bin/gpasswd
        - /usr/bin/newgrp
        - /usr/sbin/usermod
        - /usr/sbin/useradd
        - /usr/sbin/userdel
        - /usr/sbin/groupmod
        - /usr/sbin/groupadd
        - /usr/sbin/groupdel
        - /usr/bin/mount
        - /usr/bin/umount
        - /bin/mount
        - /bin/umount
        - /etc/sudoers
        - /etc/sudoers.d

    - name: "harden | strip every setuid/setgid bit on the filesystem"
      ansible.builtin.command:
        argv: [find, /, -xdev, -perm, /6000, -type, f, -exec, chmod, a-s, "{}", +]
      changed_when: true

    - name: "harden | purge caches, docs, man pages and apt state"
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/lib/apt/lists
        - /var/lib/dpkg
        - /var/cache/apt
        - /var/cache/debconf
        - /usr/share/doc
        - /usr/share/man
        - /usr/share/info
        - /usr/share/lintian
        - /root/.cache
        - /var/log/apt
        - /var/log/dpkg.log

    - name: "harden | remove ALL apt/dpkg binaries (glob — nothing installable)"
      # a glob, not an explicit list: distros ship helpers that a hand-list
      # misses (apt-cdrom, dpkg-realpath, …), and every one is a package-manager
      # entry point.
      ansible.builtin.shell:
        cmd: >-
          set -e;
          rm -f /usr/bin/apt* /usr/bin/dpkg* /usr/bin/add-apt-repository
          /usr/sbin/apt* 2>/dev/null || true
      changed_when: true
      when: harden_remove_pkg_mgr | bool

    - name: "harden | remove pip so nothing can be installed into python at runtime"
      # setuptools/wheel stay: pkg_resources is a runtime import for some tools
      # (plaso), and without pip neither can install anything anyway.
      ansible.builtin.shell:
        cmd: >-
          set -e;
          rm -f /usr/local/bin/pip /usr/local/bin/pip3* /usr/bin/pip /usr/bin/pip3*;
          for d in /usr/local/lib/python3*/site-packages /usr/lib/python3*/dist-packages
          /usr/local/lib/python3*/dist-packages; do
            rm -rf "$d"/pip "$d"/pip-* 2>/dev/null || true;
          done
      changed_when: true
      when: harden_remove_pkg_mgr | bool

    - name: "harden | remove image-specific extras"
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ harden_extra_remove }}"

    - name: "harden | record the hardening contract"
      ansible.builtin.copy:
        dest: /etc/dfir-hardened
        mode: "0444"
        content: |
          user={{ harden_user }} uid={{ harden_uid }}
          root_renamed=ansible
          pkg_mgr_removed={{ harden_remove_pkg_mgr | bool }}
