---
# FIND FACTS -> check existence AND location -> (then adx/sofelk MODIFY + VERIFY).
# dfir_zimmerman_vm_dir is optional (the processor tolerates its absence), so it
# is not asserted here.

- name: "zimmerman-preflight | docker daemon reachable"
  ansible.builtin.command: docker version
  register: dfir_zimmerman_docker
  changed_when: false

- name: "zimmerman-preflight | stat the disk-image input dir"
  ansible.builtin.stat:
    path: "{{ dfir_zimmerman_input_dir }}"
  register: dfir_zimmerman_input_stat

- name: "zimmerman-preflight | input dir exists and is a directory"
  ansible.builtin.assert:
    that:
      - dfir_zimmerman_input_stat.stat.exists
      - dfir_zimmerman_input_stat.stat.isdir is defined and dfir_zimmerman_input_stat.stat.isdir
    fail_msg: >-
      dfir_zimmerman_input_dir ({{ dfir_zimmerman_input_dir }}) is missing or is
      not a directory.
    quiet: true

- name: "zimmerman-preflight | the get_sybers_dfir.zimmerman module imports"
  ansible.builtin.command: python3 -c "import get_sybers_dfir.zimmerman"
  environment:
    PYTHONPATH: "{{ dfir_zimmerman_python_path }}"
  register: dfir_zimmerman_import
  changed_when: false

# Supply-chain guard: refuse to start unless the tool image about to run is a
# KNOWN hardened dfir/* image (label + uid 2000 + expected name). A substituted
# or un-hardened image stops the lane before any evidence is touched. This lane
# drives NINE dfir/* images (plaso for extraction/SRUM, plus the eight EZ-Tools
# containers) — every one is checked, not just the one passed as a role variable.
- name: "zimmerman-preflight | the tool image(s) are known hardened dfir/* images"
  ansible.builtin.command:
    argv: ["python3", "-m", "get_sybers_dfir.images", "--require", "{{ item }}"]
  environment:
    PYTHONPATH: "{{ dfir_zimmerman_python_path }}"
  loop:
    - "{{ dfir_zimmerman_plaso_image }}"
    - "dfir/recmd:latest"
    - "dfir/jlecmd:latest"
    - "dfir/lecmd:latest"
    - "dfir/amcacheparser:latest"
    - "dfir/appcompatcacheparser:latest"
    - "dfir/sbecmd:latest"
    - "dfir/rbcmd:latest"
    - "dfir/mftecmd:latest"
  register: dfir_zimmerman_image_guard
  changed_when: false
  when: item is match('^dfir/')
