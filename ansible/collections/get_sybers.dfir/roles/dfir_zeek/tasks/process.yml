---
# Pipeline-agnostic processing — identical for the Elastic-native and SOF-ELK pipelines; only the
# output base differs, resolved into dfir_zeek_out_dir by defaults/main.yml
# from dfir_zeek_pipeline. (SOF-ELK delivery into its watch dir is tracked
# in #45.)
#
# The three steps run as one guarded unit: on any failure the rescue surfaces
# the processor's own JSON summary and stderr as ONE clear diagnostic instead
# of a raw traceback, then fails the play (no half-configured silence). In
# check mode the command is skipped, so the gate on its output is too.
- name: "zeek-process | process, verify and gate"
  block:
    - name: "zeek-process | process pcaps into Zeek JSON"
      ansible.builtin.command:
        argv: >-
            {{ ['python3', '-m', 'get_sybers_dfir.zeek', '--pcap-dir', dfir_zeek_pcap_dir, '--out-dir', dfir_zeek_out_dir, '--image', dfir_zeek_image]
            + (['--force'] if dfir_zeek_force | bool else []) }}
      environment:
        PYTHONPATH: "{{ dfir_zeek_python_path }}"
      register: dfir_zeek_run
      changed_when: (dfir_zeek_run.stdout | from_json).processed | int > 0

    - name: "zeek-process | verify Zeek JSON logs on disk"
      ansible.builtin.find:
        paths: "{{ dfir_zeek_out_dir }}"
        patterns: "*.json"
        recurse: true
      register: dfir_zeek_verify

    - name: "zeek-process | assert output matches what was processed"
      when: dfir_zeek_run is not skipped
      ansible.builtin.assert:
        that:
          - (dfir_zeek_run.stdout | from_json).failed | int == 0
          - dfir_zeek_verify.matched | int > 0 or (dfir_zeek_run.stdout | from_json).captures | int == 0
        fail_msg: >-
          zeek reported failures, or produced no JSON logs though captures were present.
        quiet: true
  rescue:
    - name: "zeek-process | surface processor diagnostics"
      ansible.builtin.fail:
        msg: >-
          dfir_zeek processing failed.
          Summary: {{ dfir_zeek_run.stdout | default('(no summary emitted)') | trim }}
          Stderr: {{ dfir_zeek_run.stderr | default('') | trim | truncate(1000) }}
