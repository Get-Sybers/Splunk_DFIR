---
# dfir_volatility: memory images -> per-plugin JSONL. The role GROUPS; the playbook
# DECIDES. Idempotence (skip plugins with valid output) lives in the Python
# processor, not in a task's `when:`. This role asserts its own input rules, then
# delegates the shared preflight + process skeleton to dfir_lane. Per-plugin
# failures are NORMAL (Windows plugins error without symbols), so
# dfir_lane_require_no_failures=false and the gate is purely "some plugin produced
# output, or there were no images".

- name: "volatility | assert inputs"
  ansible.builtin.assert:
    that:
      - dfir_volatility_pipeline in ['elastic', 'sofelk']
      - dfir_volatility_memory_dir | length > 0
    fail_msg: >-
      dfir_volatility needs dfir_volatility_pipeline (elastic|sofelk) and a non-empty
      dfir_volatility_memory_dir.
    quiet: true
  tags: [always]

# role_path resolves to THIS role here — capture the lane-specific preflight +
# gate files so dfir_lane includes volatility's checks (PIIAT-Mem submodule) and
# output gate, not its own.
- name: "volatility | resolve lane-specific task paths"
  ansible.builtin.set_fact:
    dfir_volatility_preflight_extra: "{{ role_path }}/tasks/preflight_extra.yml"
    dfir_volatility_gate_extra: "{{ role_path }}/tasks/gate_extra.yml"
  tags: [always]

# The pipeline decision (elastic|sofelk) is carried by the resolved
# dfir_volatility_out_dir default — the shared tasks are pipeline-agnostic.
- name: "volatility | run the shared tool-lane skeleton"
  ansible.builtin.include_role:
    name: dfir_lane
  vars:
    dfir_lane_name: volatility
    dfir_lane_module: get_sybers_dfir.volatility
    dfir_lane_python_path: "{{ dfir_volatility_python_path }}"
    dfir_lane_images: ["{{ dfir_volatility_image }}"]
    dfir_lane_input_checks:
      - name: memory dir
        path: "{{ dfir_volatility_memory_dir }}"
    dfir_lane_argv: "{{ dfir_volatility_argv }}"
    dfir_lane_verify_dir: "{{ dfir_volatility_out_dir }}"
    dfir_lane_verify_glob: "*.jsonl"
    dfir_lane_require_no_failures: false
    dfir_lane_preflight_extra: "{{ dfir_volatility_preflight_extra }}"
    dfir_lane_gate_extra: "{{ dfir_volatility_gate_extra }}"
  tags: [always]
