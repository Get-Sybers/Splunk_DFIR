#############################################################################
# Attach CAR object tags to the eventtypes in eventtypes.conf.
#
# The data model's constraints are `tag=car_<object>`, so this file is what
# actually admits events into each object.
#############################################################################

[eventtype=car_flow_zeek_conn]
car_flow = enabled

[eventtype=car_user_session_evtx]
car_user_session = enabled

[eventtype=car_process_evtx]
car_process = enabled

[eventtype=car_process_l2t_execution]
car_process = enabled

[eventtype=car_process_kape_execution]
car_process = enabled

[eventtype=car_service_evtx]
car_service = enabled

[eventtype=car_registry_kape]
car_registry = enabled

[eventtype=car_file_l2t]
car_file = enabled

[eventtype=car_file_kape]
car_file = enabled
