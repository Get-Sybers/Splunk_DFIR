---
# Registers dxdfir_evidence_images ([{tree, rel, name}], one per DISTINCT disk
# image found under dxdfir_evidence_trees), dxdfir_evidence_hosts ([{name,
# export}], one per immediate subfolder of dxdfir_evidence_host_dir) and
# dxdfir_evidence_archives ([{tree, rel, name}], one per DISTINCT UAC collection
# archive found under dxdfir_evidence_archive_trees). Read-only; all three
# default to [].
- name: "evidence | start from empty result lists"
  ansible.builtin.set_fact:
    dxdfir_evidence_images: []
    dxdfir_evidence_hosts: []
    dxdfir_evidence_archives: []
  tags: [always]

# ---- disk images ------------------------------------------------------------
- name: "evidence | which of the image trees exist"
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ dxdfir_evidence_trees | reject('equalto', '') | list }}"
  register: dxdfir_evidence_tree_stats
  tags: [always]

- name: "evidence | find disk images in each present tree"
  ansible.builtin.find:
    paths: "{{ item.item }}"
    use_regex: true
    patterns: ["{{ dxdfir_evidence_image_regex }}"]
    excludes: ["{{ dxdfir_evidence_exclude_regex }}"]
    recurse: true
    file_type: file
  loop: "{{ dxdfir_evidence_tree_stats.results | selectattr('stat.isdir', 'defined') | selectattr('stat.isdir') | list }}"
  loop_control:
    label: "{{ item.item }}"
  register: dxdfir_evidence_tree_images
  tags: [always]

# One item per disk image ({tree, rel, name}), DE-DUPLICATED. The same image can
# be discovered more than once under the trees — e.g. a second copy nested in a
# wrapper folder — and each copy would otherwise become its own work item and
# collide on the processed-output filename (<subtool>/<item-name>.jsonl). Two
# finds with the same byte size AND basename are taken to be the same image; the
# shallowest path wins (then lexical), so the clean top-level name is kept over a
# nested duplicate. The item name is the image's path relative to its tree,
# separators and whitespace folded to _ (the batch runtime's own item-naming
# rule).
- name: "evidence | one item per disk image, de-duplicated ({tree, rel, name})"
  ansible.builtin.set_fact:
    dxdfir_evidence_images: >-
      {%- set cands = [] -%}
      {%- for pair in (dxdfir_evidence_tree_images.results | default([])
                       | selectattr('files', 'defined') | subelements('files')) -%}
        {%- set rel = pair.1.path | relpath(pair.0.item.item) -%}
        {%- set _ = cands.append({
              'tree': pair.0.item.item, 'rel': rel,
              'name': rel | regex_replace('[/\\:\s]+', '_'),
              'key': (pair.1.size | string) ~ ':' ~ (pair.1.path | basename),
              'depth': rel.split('/') | length}) -%}
      {%- endfor -%}
      {%- set seen = [] -%}
      {%- set out = [] -%}
      {%- for c in cands | sort(attribute='rel') | sort(attribute='depth') -%}
        {%- if c.key not in seen -%}
          {%- set _ = seen.append(c.key) -%}
          {%- set _ = out.append({'tree': c.tree, 'rel': c.rel, 'name': c.name}) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}
  tags: [always]

# ---- loose hosts ------------------------------------------------------------
- name: "evidence | stat the loose-host tree"
  ansible.builtin.stat:
    path: "{{ dxdfir_evidence_host_dir }}"
  when: dxdfir_evidence_host_dir | length > 0
  register: dxdfir_evidence_host_stat
  tags: [always]

- name: "evidence | the loose hosts: every folder directly under the host tree"
  ansible.builtin.find:
    paths: "{{ dxdfir_evidence_host_dir }}"
    file_type: directory
    recurse: false
  when: (dxdfir_evidence_host_stat.stat | default({})).isdir | default(false)
  register: dxdfir_evidence_host_find
  tags: [always]

# canonical shape {name, export}: gowindowlicker reads .export as its host dirs,
# godaemonhunter takes the {name, export} dicts directly
- name: "evidence | one item per loose host ({name, export})"
  ansible.builtin.set_fact:
    dxdfir_evidence_hosts: >-
      {%- set h = [] -%}
      {%- for f in (dxdfir_evidence_host_find.files | default([])) | sort(attribute='path') -%}
        {%- set _ = h.append({'name': f.path | basename, 'export': f.path}) -%}
      {%- endfor -%}
      {{ h }}
  when: dxdfir_evidence_host_find is not skipped
  tags: [always]

# ---- collection archives ----------------------------------------------------
- name: "evidence | which of the archive trees exist"
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ dxdfir_evidence_archive_trees | reject('equalto', '') | list }}"
  register: dxdfir_evidence_archive_tree_stats
  tags: [always]

- name: "evidence | find collection archives in each present tree"
  ansible.builtin.find:
    paths: "{{ item.item }}"
    use_regex: true
    patterns: ["{{ dxdfir_evidence_archive_regex }}"]
    recurse: true
    file_type: file
  loop: "{{ dxdfir_evidence_archive_tree_stats.results | selectattr('stat.isdir', 'defined') | selectattr('stat.isdir') | list }}"
  loop_control:
    label: "{{ item.item }}"
  register: dxdfir_evidence_tree_archives
  tags: [always]

# the same {tree, rel, name} shape as a disk image: the godaemonhunter lane
# hunts ON an archive exactly as on an image (GODAEMONHUNTER_IMAGE=<rel>), and it
# is de-duplicated the same way (size + basename, shallowest path wins).
- name: "evidence | one item per collection archive, de-duplicated ({tree, rel, name})"
  ansible.builtin.set_fact:
    dxdfir_evidence_archives: >-
      {%- set cands = [] -%}
      {%- for pair in (dxdfir_evidence_tree_archives.results | default([])
                       | selectattr('files', 'defined') | subelements('files')) -%}
        {%- set rel = pair.1.path | relpath(pair.0.item.item) -%}
        {%- set _ = cands.append({
              'tree': pair.0.item.item, 'rel': rel,
              'name': rel | regex_replace('[/\\:\s]+', '_'),
              'key': (pair.1.size | string) ~ ':' ~ (pair.1.path | basename),
              'depth': rel.split('/') | length}) -%}
      {%- endfor -%}
      {%- set seen = [] -%}
      {%- set out = [] -%}
      {%- for c in cands | sort(attribute='rel') | sort(attribute='depth') -%}
        {%- if c.key not in seen -%}
          {%- set _ = seen.append(c.key) -%}
          {%- set _ = out.append({'tree': c.tree, 'rel': c.rel, 'name': c.name}) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}
  tags: [always]
