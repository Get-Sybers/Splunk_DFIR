---
# Pipeline-agnostic processing — identical for the Elastic-native and SOF-ELK pipelines; only the
# output base differs, resolved into dfir_evtx_out_dir by defaults/main.yml
# from dfir_evtx_pipeline. (SOF-ELK delivery into its watch dir is tracked
# in #45.)
#
# The three steps run as one guarded unit: on any failure the rescue surfaces
# the processor's own JSON summary and stderr as ONE clear diagnostic instead
# of a raw traceback, then fails the play (no half-configured silence). In
# check mode the command is skipped, so the gate on its output is too.
- name: "evtx-process | process, verify and gate"
  block:
    - name: "evtx-process | parse .evtx into EvtxECmd JSON"
      ansible.builtin.command:
        argv: >-
            {{ ['python3', '-m', 'get_sybers_dfir.evtx', '--out-dir', dfir_evtx_out_dir, '--image', dfir_evtx_image]
            + (['--evtx-dir', dfir_evtx_evtx_dir] if dfir_evtx_evtx_dir | length > 0 else [])
            + (['--image-src', dfir_evtx_image_src, '--plaso-image', dfir_evtx_plaso_image]
            + (['--stage-dir', dfir_evtx_stage_dir] if dfir_evtx_stage_dir | length > 0 else [])
            + (['--vss'] if dfir_evtx_vss | bool else [])
            if dfir_evtx_image_src | length > 0 else [])
            + ([] if dfir_evtx_use_bundled_image | bool else ['--evtxecmd-dir', dfir_evtx_evtxecmd_dir])
            + (['--hayabusa', '--hayabusa-dir', dfir_evtx_hayabusa_dir]
            + (['--hayabusa-rules', dfir_evtx_hayabusa_rules] if dfir_evtx_hayabusa_rules | length > 0 else [])
            if dfir_evtx_hayabusa | bool else [])
            + (['--force'] if dfir_evtx_force | bool else []) }}
      environment:
        PYTHONPATH: "{{ dfir_evtx_python_path }}"
      register: dfir_evtx_run
      changed_when: (dfir_evtx_run.stdout | from_json).processed | int > 0

    - name: "evtx-process | verify EvtxECmd JSON on disk"
      ansible.builtin.find:
        paths: "{{ dfir_evtx_out_dir }}"
        patterns: "*_EvtxECmd_Output.json"
        recurse: true
      register: dfir_evtx_verify

    - name: "evtx-process | assert output matches what was processed"
      when: dfir_evtx_run is not skipped
      ansible.builtin.assert:
        that:
          - (dfir_evtx_run.stdout | from_json).failed | int == 0
          - dfir_evtx_verify.matched | int > 0 or (dfir_evtx_run.stdout | from_json).files | int == 0
        fail_msg: >-
          evtx reported failures, or produced no JSON though logs were present.
        quiet: true
  rescue:
    - name: "evtx-process | surface processor diagnostics"
      ansible.builtin.fail:
        msg: >-
          dfir_evtx processing failed.
          Summary: {{ dfir_evtx_run.stdout | default('(no summary emitted)') | trim }}
          Stderr: {{ dfir_evtx_run.stderr | default('') | trim | truncate(1000) }}
