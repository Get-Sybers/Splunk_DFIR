---
- name: Verify
  hosts: localhost
  gather_facts: false
  vars:
    molecule_out: /tmp/dfir_evtx_molecule/out
  tasks:
    - name: "molecule-verify | find the dfir_evtx_produced EvtxECmd JSON"
      ansible.builtin.find:
        paths: "{{ molecule_out }}"
        patterns: "*_EvtxECmd_Output.json"
        recurse: true
      register: dfir_evtx_produced

    - name: "molecule-verify | assert JSON was dfir_evtx_produced under the host group"
      ansible.builtin.assert:
        that:
          - dfir_evtx_produced.matched | int > 0
          - dfir_evtx_produced.files | map(attribute='path') | select('search', '/HOST01/') | list | length > 0
        fail_msg: "no EvtxECmd JSON dfir_evtx_produced from the sample log under the host group"
        quiet: true
