# baseline_servers.conf
# Creates a lookup of server information based on Zeek connection logs and client information

[Baseline_Servers]
action.email.useNSSubject = 1
alert.track = 0
cron_schedule = 0 5 * * *
description = Creates a lookup of server information based on Zeek connection logs and client information
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
display.general.timeRangePicker.show = 0
display.general.type = statistics
display.page.search.tab = statistics
display.visualizations.show = 0
enableSched = 1
request.ui_dispatch_app = search
request.ui_dispatch_view = search
search = index=zeek sourcetype="bro:conn:json"\
    | eval Client_IP=id.resp_h\
    | lookup Baseline_DomainName_ClientName_ClientIP.csv Client_IP OUTPUT Client_Name\
    | table Client_IP Client_Name service\
    | dedup Client_IP Client_Name service\
    | outputlookup Baseline_Servers.csv