---
# The playbook holds the decisions. It selects the role and passes the pipeline;
# the role groups, the tasks act (one-action-per-task).
- name: "DFIR | process disk images with Eric Zimmerman's EZ-Tools"
  hosts: "{{ dxdfir_hosts | default('localhost') }}"
  connection: "{{ dxdfir_connection | default('local') }}"
  gather_facts: true
  tasks:
    - name: "dxdfir-process-zimmerman | run the zimmerman role"
      ansible.builtin.include_role:
        name: dxdfir_zimmerman
