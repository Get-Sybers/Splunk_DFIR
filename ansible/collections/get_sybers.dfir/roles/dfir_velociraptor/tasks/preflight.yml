---
# FIND FACTS -> check existence AND location -> (then adx/sofelk MODIFY + VERIFY).
# No docker check: the velociraptor lane is pure Python (zipfile), no container.

- name: "velociraptor-preflight | stat the collections dir"
  ansible.builtin.stat:
    path: "{{ dfir_velociraptor_raw_dir }}"
  register: dfir_velociraptor_raw_stat

- name: "velociraptor-preflight | collections dir exists and is a directory"
  ansible.builtin.assert:
    that:
      - dfir_velociraptor_raw_stat.stat.exists
      - dfir_velociraptor_raw_stat.stat.isdir is defined and dfir_velociraptor_raw_stat.stat.isdir
    fail_msg: >-
      dfir_velociraptor_raw_dir ({{ dfir_velociraptor_raw_dir }}) is missing or is
      not a directory.
    quiet: true

- name: "velociraptor-preflight | the get_sybers_dfir.velociraptor module imports"
  ansible.builtin.command: python3 -c "import get_sybers_dfir.velociraptor"
  environment:
    PYTHONPATH: "{{ dfir_velociraptor_python_path }}"
  register: dfir_velociraptor_import
  changed_when: false
