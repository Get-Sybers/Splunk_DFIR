---
argument_specs:
  main:
    short_description: "disk images -> Eric Zimmerman EZ-Tools artefact parse, one output dir per host."
    description:
      - >-
        Discovers disk images under dfir_zimmerman_input_dir (and VM exports under
        dfir_zimmerman_vm_dir), extracts the zimmerman artefact set (registry hives +
        transaction logs, Amcache, jump lists/lnk, Recycle Bin $I records, Windows
        Timeline database, SRUM database, resident $MFT) with a plaso YAML collection
        filter, then runs each hardened EZ-Tools container over what was pulled out
        (RECmd, JLECmd, LECmd, AmcacheParser, AppCompatCacheParser, SBECmd, RBCmd,
        MFTECmd) plus a plaso log2timeline/psort two-step for SRUM. Idempotent at the
        host level: a host output dir that already holds any file is skipped unless
        dfir_zimmerman_force.
    options:
      dfir_zimmerman_pipeline:
        type: str
        required: false
        default: adx
        choices: [adx, sofelk]
        description: "Which backend to target; selects the output destination."
      dfir_zimmerman_input_dir:
        type: str
        required: false
        description: "Disk-image tree (E01/raw/img/dd/vmdk/vhd/vhdx/aff), recursed."
      dfir_zimmerman_vm_dir:
        type: str
        required: false
        description: "VMware VM export folders (one sub-folder per VM); optional."
      dfir_zimmerman_adx_out_dir:
        type: str
        required: false
        description: "ADX-path output dir (default data_store/processed/zimmerman)."
      dfir_zimmerman_sofelk_out_dir:
        type: str
        required: false
        description: "SOF-ELK-path output dir (delivered into SOF-ELK by dfir_ingest_sofelk)."
      dfir_zimmerman_out_dir:
        type: str
        required: false
        description: >-
          Resolved output base for the selected pipeline (defaults to the
          adx/sofelk out dir per dfir_zimmerman_pipeline); override to send
          output to a custom location.
      dfir_zimmerman_plaso_image:
        type: str
        required: false
        default: "dfir/plaso:latest"
        description: >-
          The hardened in-repo Plaso image, used both for artefact extraction
          (image_export.py against a YAML collection filter) and the SRUM
          two-step (log2timeline.py esedb/srum -> psort.py json_line).
      dfir_zimmerman_vss:
        type: bool
        required: false
        default: false
        description: "Also extract from Volume Shadow Copies during artefact extraction."
      dfir_zimmerman_python_path:
        type: str
        required: false
        description: "PYTHONPATH to the get_sybers_dfir package (in-repo/dev runs)."
      dfir_zimmerman_force:
        type: bool
        required: false
        default: false
        description: "Reprocess hosts that already have output."
