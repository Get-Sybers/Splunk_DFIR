name: Detect_Outbound_Traffic
id: 
version: 1
date: '2024-08-01'
author: Jake Badoino
status: experimental
type: anomaly
description: This detection identifies new Client_IP or Client_Name on the network by comparing current DNS data against a baseline of known clients and IPs. The purpose is to detect any previously unseen devices or hosts that appear in the network traffic. This is particularly useful in environments where network changes are infrequent, and any new device could indicate unauthorized access or misconfiguration.
data_source: [zeek]
search: '
        # Load the baseline lookup table
        | inputlookup Baseline_DomainName_ClientName_ClientIP.csv
        | table Client_IP
        | rename Client_IP as known_subnet

        # Join with conn log to flag unknown subnets
        | join type=outer [ search index=network sourcetype="zeek:conn"
        | eval orig_subnet=mvindex(split(id.orig_h, "."), 0) . "." . mvindex(split(id.orig_h, "."), 1)
        | eval resp_subnet=mvindex(split(id.resp_h, "."), 0) . "." . mvindex(split(id.resp_h, "."), 1) 
        | fields id.orig_h, orig_subnet, id.resp_h, resp_subnet ]

        # Identify unknown subnets
        | eval is_known_orig_subnet=if(orig_subnet IN (known_subnet), "yes", "no")
        | eval is_known_resp_subnet=if(resp_subnet IN (known_subnet), "yes", "no")
        | where is_known_orig_subnet="no" OR is_known_resp_subnet="no"
        | table id.orig_h, id.orig_p, id.resp_h, id.resp_p, proto, service, conn_state'
        
how_to_implement: This detection utilizes the lookup Baseline_DomainName_ClientName_ClientIP.csv to compare current DNS logs against the baseline of known clients and IPs. Ensure that this baseline lookup is regularly updated with legitimate devices to minimize false positives.
known_false_positives: New legitimate devices connecting to the network may be detected as false positives. Regularly updating the baseline with verified devices can help reduce false positives. Any new, unknown devices should be investigated.
references: []
tags:
  analytic_story:
  asset_type: Endpoint
  confidence: 
  impact: 
  message: A new client IP $Client_IP$ or client name $Client_Name$ was detected on the network.
  mitre_attack_id:
  observable:
  - name: Client_IP
    type: IP Address
    role:
    - Victim
  - name: Client_Name
    type: String
    role:
    - Victim
  product:
  - Splunk Enterprise
  - Splunk Enterprise Security
  - Splunk Cloud
  required_fields:
  - _time
  - Data.DNSName
  - Data.IPAddress
  - Client_Name
  - Domain_Name
  - Client_IP
  - answers
  - query
  risk_score: 
  security_domain: network
tests:
- name: True Positive Test
  attack_data:
  - data: 
    sourcetype: zeek:conn
    source: conn.log