name: Detect_ICMP_Scans_Ping_Sweeps
id: 
version: 1
date: '2024-08-01'
author: Jake Badoino
status: experimental
type: anomaly
description: This detection identifies potential network discovery activities by monitoring ICMP echo requests (ping) that exceed a certain threshold, indicating possible reconnaissance attempts.
data_source: [zeek]
search: '
        index=network sourcetype="zeek:conn"
        | search icmp_type=8
        | stats count by id_orig_h, id_resp_h
        | rename id_orig_h as "Source IP", id_resp_h as "Destination IP", count as "ping_count"
        | where "ping_count" > 10
        | sort - "ping_count"'
how_to_implement: This detection utilizes the lookup Baseline_DomainName_ClientName_ClientIP.csv to compare current DNS logs against the baseline of known clients and IPs. Ensure that this baseline lookup is regularly updated with legitimate devices to minimize false positives.
known_false_positives: High volumes of ICMP echo requests may be legitimate in some environments, such as during network performance testing or monitoring. Regularly review and adjust the threshold value based on normal network behavior to minimize false positives.
references: []
tags:
  analytic_story:
  - Network Discovery
  - Reconnaissance
  asset_type: Endpoint
  confidence: 50
  impact: 50
  message: A potential network discovery activity detected from $Source IP$ pinging $Destination IP$ with $ping_count$ ICMP echo requests.
  mitre_attack_id:
  - T1018
  observable:
  - name: Source IP
    type: IP Address
    role:
    - Attacker
  - name: Destination IP
    type: IP Address
    role:
    - Victim
  product:
  - Splunk Enterprise
  - Splunk Enterprise Security
  - Splunk Cloud
  required_fields:
  - _time
  - id_orig_h
  - id_resp_h
  - icmp_type
  risk_score: 50
  security_domain: network
tests:
- name: True Positive Test
  attack_data:
  - data: 
    sourcetype: zeek:conn
    source: conn.log
