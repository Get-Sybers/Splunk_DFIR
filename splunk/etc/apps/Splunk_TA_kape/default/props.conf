#############################################################################################
#                                   Kape JSON                                              #
#############################################################################################
[kape:json]
MAX_DAYS_AGO = 10000
TRANSFORMS-sourcetype = extract_kape_sourcetype


# ################ kape:json:ProgramExecution ################
[kape:json:ProgramExecution]
MAX_DAYS_AGO = 10000
# Parsing and performance settings
INDEXED_EXTRACTIONS = JSON
KV_MODE = json
NO_BINARY_CHECK = true
TRUNCATE = 0
MAX_EVENTS = 0
TIMESTAMP_FIELDS = LastRun, TimeCreated
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%7N
# Alias for uniformity with CSV outputs
FIELDALIAS-timestamp = LastRun AS timestamp


# # # # # # # # # # kape:json:EventLogs # # # # # # # # #
[kape:json:EventLogs]
MAX_DAYS_AGO = 10000
# Parsing and performance settings
INDEXED_EXTRACTIONS = JSON
KV_MODE = json
NO_BINARY_CHECK = true
TRUNCATE = 0
MAX_EVENTS = 0
EVAL-timestamp = TimeCreated
TIMESTAMP_FIELDS = timestamp
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%7N
# Force timestamp because I will not be beaten
EVAL-_time = TimeCreated


# # # # # # # # # # kape:json:FileFolderAccess # # # # # # # # #
[kape:json:FileFolderAccess]
MAX_DAYS_AGO = 10000
# Parsing and performance settings
INDEXED_EXTRACTIONS = JSON
KV_MODE = json
AUTO_KV_JSON = true
JSON_TRIM_BRACES_IN_ARRAY_NAMES = true
NO_BINARY_CHECK = true
TRUNCATE = 0
MAX_EVENTS = 0
EVAL-timestamp = TimeCreated
TIMESTAMP_FIELDS = timestamp, TargetAccessed
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%7N
# time fields SourceCreated, SourceModified, SourceAccessed, TargetCreated, TargetModified, TargetAccessed
SHOULD_LINEMERGE = false

[kape:json:SOF-ELK]
MAX_DAYS_AGO = 10000
# Parsing and performance settings
INDEXED_EXTRACTIONS = JSON
KV_MODE = json
LINE_BREAKER = ([\r\n]+)
NO_BINARY_CHECK = true
TRUNCATE = 0
MAX_EVENTS = 0
TIMESTAMP_FIELDS = TimeCreated
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%7N
FIELDALIAS-timestamp = TimeCreated AS timestamp

