---
- name: Verify
  hosts: localhost
  gather_facts: false
  vars:
    molecule_out: /tmp/dfir_velociraptor_molecule/out
  tasks:
    - name: "molecule-verify | find the laid-out artefact JSON"
      ansible.builtin.find:
        paths: "{{ molecule_out }}"
        patterns: "*.json"
        recurse: true
      register: produced

    - name: "molecule-verify | assert the registry artefact was laid out"
      ansible.builtin.assert:
        that:
          - produced.matched | int > 0
          - produced.files | map(attribute='path') | map('basename') | select('search', '^Windows\\.Registry\\.RecentApps\\.json$') | list | length > 0
        fail_msg: "no Windows.Registry.RecentApps.json laid out from the fixture collection"
        quiet: true
