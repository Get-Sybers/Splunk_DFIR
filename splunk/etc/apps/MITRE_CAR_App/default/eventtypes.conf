#############################################################################
# Which events can populate which MITRE CAR object.
#
# The data model constrains each object on a tag (tag=car_process, ...).
# These eventtypes are what tags.conf attaches those tags to. An object with
# no matching events returns nothing — which is the correct, visible outcome
# for a source this project cannot map yet, rather than a half-populated
# object that looks like it works.
#
# Every eventtype below is scoped to a sourcetype this repository actually
# produces. Nothing is tagged speculatively.
#############################################################################

# --- flow: network connections ---------------------------------------------
# Zeek conn.log. Requires the operator-supplied Splunk_TA_zeek, which is what
# splits `sourcetype=zeek` into zeek:conn and the other 68 — without it Zeek
# data never reaches this eventtype, which is the same condition under which
# it is unparsed anyway.
[car_flow_zeek_conn]
search = sourcetype=zeek:conn

# --- user_session: logon / logoff ------------------------------------------
# Security channel logon events, parsed offline by EvtxECmd.
#   4624 logon        4625 failed logon   4634 logoff
#   4647 user logoff  4648 explicit cred  4778/4779 RDP reconnect/disconnect
[car_user_session_evtx]
search = sourcetype=evtxecmd:json (EventId=4624 OR EventId=4625 OR EventId=4634 OR EventId=4647 OR EventId=4648 OR EventId=4778 OR EventId=4779)

# --- process: creation / termination ---------------------------------------
#   4688 process created, 4689 process exited
[car_process_evtx]
search = sourcetype=evtxecmd:json (EventId=4688 OR EventId=4689)

# Plaso execution artefacts. Prefetch, Amcache and AppCompatCache record that a
# binary ran; they carry no pid, ppid or command line, so those CAR fields stay
# null rather than being invented.
[car_process_l2t_execution]
search = sourcetype=l2t:csv (sourcetype_l2t="*prefetch*" OR sourcetype_l2t="*amcache*" OR sourcetype_l2t="*appcompat*")

# KAPE's ProgramExecution category is the same class of artefact.
[car_process_kape_execution]
search = (sourcetype=kape:json:ProgramExecution OR sourcetype=kape:csv:ProgramExecution)

# --- service: service control ----------------------------------------------
#   7045 service installed (System channel), 4697 service installed (Security)
[car_service_evtx]
search = sourcetype=evtxecmd:json (EventId=7045 OR EventId=4697)

# --- registry --------------------------------------------------------------
[car_registry_kape]
search = (sourcetype=kape:json:Registry OR sourcetype=kape:csv:Registry)

# --- file ------------------------------------------------------------------
# Plaso filesystem timeline entries, and KAPE's file-access / deletion sets.
[car_file_l2t]
search = sourcetype=l2t:csv (sourcetype_l2t="*fs*" OR sourcetype_l2t="*ntfs*" OR sourcetype_l2t="*file*")

[car_file_kape]
search = (sourcetype=kape:json:FileFolderAccess OR sourcetype=kape:csv:FileFolderAccess OR sourcetype=kape:json:FileDeletion OR sourcetype=kape:csv:FileDeletion)
