---
# pinned — never :latest, never a bare branch (ansible-standards infra galaxy §2).
# Installed into $DX_DFIR/.ansible/collections (ansible.cfg home=.ansible,
# collections_path leads with .ansible/collections) by scripts/setup-environment.sh.
collections:
  # the container-interaction galaxy, imported BY URL from the GoDFIR-toolz repo at
  # a pinned ref (replaces the former docker/GoDFIR-toolz git submodule). It
  # ships the godfir_run engine, godfir_images (registry pull + verify/audit) and
  # the per-image lanes; the pipeline + evidence roles delegate to it.
  - name: https://github.com/Get-Sybers/GoDFIR-toolz.git#/ansible_collections/get_sybers/godfir_run
    type: git
    # GoDFIR-toolz main @ the #128 merge: the flat lane output, on top of the
    # evidence-identity capture. Lane records now land flat at
    # <subtool>/<asset-id>.jsonl — one file per (parser, evidence asset), the
    # per-artefact path carried in each row's Origin.Path. gowindowlicker v0.3.1
    # and godaemonhunter v0.4.1 do the collapse engine-side (gopinfo untouched),
    # and the godfir_run loose-host lanes mount /input/<host> so the flat leaf is
    # named by the host; godaemonhunter's Layer-1 knowledge store stays per-item.
    # The evidence-asset identity it builds on (gopinfo v0.3.0 Origin fields +
    # stamp hook, gomount v0.4.0 surfacing the disk/volume/image ids, host.id +
    # Origin.{DiskSerial,VolumeGUID,ImageSHA256,DiskID,PartGUID,PartOffset} on
    # every row) is carried from #125. godfir_run galaxy 0.2.8; images.yml records
    # the releases + content digests:
    #   gowindowlicker v0.3.1  sha256:c128a94401c43a86e00e311a8f32f9b9fe992913035398d0633e51e262776768
    #   godaemonhunter v0.4.1  sha256:7a1afdd751050ad105223db557fd49fe03dd912005801c62c8187da0e51f788f
    #   gomount        v0.4.0  sha256:0619ddef7ec63d558d249044d88fcf0c1699e2b3c3906490513082ff4d1b1871
    #   signatures     v0.2.2  sha256:04e7209204a0aa936425c24261fc841ba2b631bd66a7a8152abcfb71c5e2bdd0
    # byakugan stays v0.2.5. Pull every tool image by its :<release> tag, then
    # verify it against the content digest images.yml records. A commit SHA, not a
    # release tag — the collection is not tagged; move to the tag once it is cut.
    version: 969e7436b4115c28551f0975b18cd0307c822343
  - name: community.docker
    version: "3.13.10"
  # ansible.cfg enables its profile_tasks callback — a runtime dependency
  - name: ansible.posix
    version: "2.2.2"
  # dxdfir_stack's host-side TLS generation
  - name: community.crypto
    version: "2.26.9"
