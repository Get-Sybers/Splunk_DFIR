---
# The playbook holds the decisions; the role groups, the tasks act.
- name: "DFIR | deliver processed output into SOF-ELK's watch dir"
  hosts: "{{ dxdfir_hosts | default('localhost') }}"
  connection: "{{ dxdfir_connection | default('local') }}"
  gather_facts: true
  tasks:
    - name: "dxdfir-ingest-sofelk | run the sofelk delivery role"
      ansible.builtin.include_role:
        name: dxdfir_ingest_sofelk
