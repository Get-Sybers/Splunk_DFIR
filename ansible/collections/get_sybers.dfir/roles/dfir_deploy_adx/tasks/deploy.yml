---
- name: "deploy-adx | pull the emulator image"
  community.docker.docker_image:
    name: "{{ dfir_deploy_adx_image }}"
    source: pull
    force_source: false
  register: dfir_deploy_adx_pull
  retries: 3
  delay: 10
  until: dfir_deploy_adx_pull is succeeded

# A bridge with IP masquerade disabled: published ports keep working (inbound
# DNAT) but the container gets no useful egress. NOT `internal: true` — an
# internal network blocks published ports in both directions. The module is
# idempotent, so a leftover network with the wrong options is converged.
- name: "deploy-adx | create the isolated network (masquerade off, not internal)"
  community.docker.docker_network:
    name: "{{ dfir_deploy_adx_network }}"
    driver: bridge
    internal: false
    driver_options:
      com.docker.network.bridge.enable_ip_masquerade: "false"
  when: dfir_deploy_adx_isolated | bool

- name: "deploy-adx | run the emulator container (localhost-only, ACCEPT_EULA=Y)"
  community.docker.docker_container:
    name: "{{ dfir_deploy_adx_container }}"
    image: "{{ dfir_deploy_adx_image }}"
    pull: never
    state: started
    detach: true
    tty: true
    memory: "{{ dfir_deploy_adx_memory }}"
    networks: "{{ [{'name': dfir_deploy_adx_network}] if dfir_deploy_adx_isolated | bool else omit }}"
    ports:
      - "{{ dfir_deploy_adx_host }}:{{ dfir_deploy_adx_port }}:8080"
    env:
      ACCEPT_EULA: "Y"

# Docker's published-port rules sit AHEAD of the host firewall, so the -p
# mapping must not be taken on faith: read the real bindings back and fail if
# anything is bound off the requested address.
- name: "deploy-adx | read back the real port bindings"
  community.docker.docker_container_info:
    name: "{{ dfir_deploy_adx_container }}"
  register: dfir_deploy_adx_info

- name: "deploy-adx | assert no port is bound to the wildcard address"
  ansible.builtin.assert:
    that:
      - >-
        dfir_deploy_adx_host == '0.0.0.0' or
        (dfir_deploy_adx_info.container.NetworkSettings.Ports | default({}))
        | dict2items | map(attribute='value') | select | flatten
        | map(attribute='HostIp') | select('in', ['0.0.0.0', '::'])
        | list | length == 0
    fail_msg: >-
      a port is bound to the wildcard address despite
      dfir_deploy_adx_host={{ dfir_deploy_adx_host }}:
      {{ dfir_deploy_adx_info.container.NetworkSettings.Ports }}.
      The emulator has no auth — remove it: docker rm -f {{ dfir_deploy_adx_container }}
    quiet: true

# Isolation is VERIFIED, not assumed: disabling masquerade breaks return
# traffic rather than dropping packets, so a host with its own forwarding rules
# can still let traffic out. rc 0 = the container reached the internet.
# Reported, not fatal — a weakened control is no reason to leave the operator
# without a working service (matching the retired shell deploy's behaviour).
- name: "deploy-adx | probe egress from inside the container"
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ dfir_deploy_adx_container }}"
      - bash
      - -c
      - "timeout 4 bash -c 'echo > /dev/tcp/1.1.1.1/443'"
  register: dfir_deploy_adx_egress
  changed_when: false
  failed_when: false
  when: dfir_deploy_adx_isolated | bool

- name: "deploy-adx | warn if the container reached the network"
  ansible.builtin.debug:
    msg: >-
      ISOLATION NOT HOLDING — the container made an outbound TCP connection.
      It is running and usable, but it can reach the network and it holds
      evidence. For a hard guarantee add a DOCKER-USER firewall rule for the
      {{ dfir_deploy_adx_network }} subnet.
  when: dfir_deploy_adx_isolated | bool and dfir_deploy_adx_egress.rc == 0

- name: "deploy-adx | wait for the engine to answer"
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - get_sybers_dfir.ingest
      - --ping
      - --host
      - "{{ dfir_deploy_adx_host }}"
      - --port
      - "{{ dfir_deploy_adx_port | string }}"
  environment:
    PYTHONPATH: "{{ dfir_deploy_adx_python_path }}"
  register: dfir_deploy_adx_ready
  changed_when: false
  retries: 30
  delay: 5
  until: dfir_deploy_adx_ready.rc == 0

- name: "deploy-adx | create databases + apply the schema"
  ansible.builtin.command:
    argv: >-
      {{ ['python3', '-m', 'get_sybers_dfir.deploy', '--schema-dir', dfir_deploy_adx_schema_dir, '--host', dfir_deploy_adx_host,
          '--port', dfir_deploy_adx_port | string, '--container', dfir_deploy_adx_container]
      + (['--persist'] if dfir_deploy_adx_persist | bool else []) }}
  environment:
    PYTHONPATH: "{{ dfir_deploy_adx_python_path }}"
  register: dfir_deploy_adx_schema
  changed_when: (dfir_deploy_adx_schema.stdout | from_json).created_dbs | int > 0

- name: "deploy-adx | assert the schema applied cleanly"
  ansible.builtin.assert:
    that:
      - (dfir_deploy_adx_schema.stdout | from_json).failed | int == 0
    fail_msg: >-
      schema apply reported failures: {{ (dfir_deploy_adx_schema.stdout | from_json).errors }}
    quiet: true
