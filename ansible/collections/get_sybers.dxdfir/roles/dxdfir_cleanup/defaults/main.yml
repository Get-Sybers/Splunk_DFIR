---
# dxdfir_cleanup: wipe processed evidence, the CAR tree, or the get-sybers/* images.
# One role, three actions (dxdfir_cleanup_action); the playbook decides. The
# front-end handles the destructive confirmation and passes --check for a dry run.

dxdfir_cleanup_action: processed

# Repo root is five levels up from this role.
dxdfir_cleanup_repo_root: "{{ role_path }}/../../../../.."

dxdfir_cleanup_processed_dir: "{{ dxdfir_cleanup_repo_root }}/data_store/processed"
dxdfir_cleanup_car_dir: "{{ dxdfir_cleanup_repo_root }}/data_store/processed/byakugan"

# docker: also prune dangling layers; and target EVERY get-sybers/* image rather
# than only the hardened tool set (which is selected by the
# com.get-sybers.hardened=true label the build stamps on each tool image).
dxdfir_cleanup_dangling: false
dxdfir_cleanup_all_dxdfir: false

# Escalate the destructive filesystem removal (the processed/car wipes): the
# lanes' containerised goTools write their output as a different uid (the tool
# images run as uid 2000), so the connection user cannot remove that tree and a
# wipe dies on EACCES. Opt-in, set true by the CLI for the wipe actions only;
# the docker action removes images through the daemon and never escalates.
# Mirrors dxdfir_stack_become — see dxdfir_stack's privilege decision.
dxdfir_cleanup_become: false
