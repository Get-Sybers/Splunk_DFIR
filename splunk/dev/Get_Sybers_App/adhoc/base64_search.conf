# base64_search.conf
# Search for potential Base64 encoded data

[Base64_Search]
action.email.useNSSubject = 1
alert.track = 0
description = Searches for potential Base64 encoded data
dispatch.earliest_time = -60m@m
dispatch.latest_time = now
display.general.timeRangePicker.show = 0
display.general.type = statistics
display.page.search.tab = statistics
display.visualizations.show = 0
enableSched = 0
request.ui_dispatch_app = search
request.ui_dispatch_view = search
search = index=your_index sourcetype=your_sourcetype\
| search your_field_name="[A-Za-z0-9+/=]{16,}"\
| table _time, your_field_name