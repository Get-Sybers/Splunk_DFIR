---
# FIND FACTS -> check existence AND location -> (then adx/sofelk MODIFY + VERIFY).

- name: "volatility-preflight | docker daemon reachable"
  ansible.builtin.command: docker version
  register: dfir_volatility_docker
  changed_when: false

- name: "volatility-preflight | stat the memory dir"
  ansible.builtin.stat:
    path: "{{ dfir_volatility_memory_dir }}"
  register: dfir_volatility_mem_stat

- name: "volatility-preflight | memory dir exists and is a directory"
  ansible.builtin.assert:
    that:
      - dfir_volatility_mem_stat.stat.exists
      - dfir_volatility_mem_stat.stat.isdir is defined and dfir_volatility_mem_stat.stat.isdir
    fail_msg: >-
      dfir_volatility_memory_dir ({{ dfir_volatility_memory_dir }}) is missing or is
      not a directory.
    quiet: true

# The renderer + custom plugins belong to the PIIAT-Mem tool (the submodule); the
# lane drives it through its CLI, so the guard is "the tool runs" — which also
# catches an uninitialized submodule — not a stat of files we no longer pass.
- name: "volatility-preflight | run the PIIAT-Mem tool (--list-plugins)"
  ansible.builtin.command:
    argv: ["python3", "-m", "piiat_mem", "--list-plugins"]
  environment:
    PYTHONPATH: "{{ dfir_volatility_piiat_mem_dir }}"
  register: dfir_volatility_piiat
  changed_when: false
  failed_when: false

- name: "volatility-preflight | the PIIAT-Mem tool is runnable (submodule checked out)"
  ansible.builtin.assert:
    that:
      - dfir_volatility_piiat.rc == 0
    fail_msg: >-
      PIIAT-Mem is not runnable at {{ dfir_volatility_piiat_mem_dir }} — the submodule is
      likely not checked out. Run: git submodule update --init third_party/piiat-mem
    quiet: true

- name: "volatility-preflight | the get_sybers_dfir.volatility module imports"
  ansible.builtin.command: python3 -c "import get_sybers_dfir.volatility"
  environment:
    PYTHONPATH: "{{ dfir_volatility_python_path }}"
  register: dfir_volatility_import
  changed_when: false

# Supply-chain guard: refuse to start unless the tool image about to run is a
# KNOWN hardened dfir/* image (label + uid 2000 + expected name). A substituted
# or un-hardened image stops the lane before any evidence is touched. A non-dfir
# image (operator-supplied .NET runtime) is out of scope and passes.
- name: "volatility-preflight | the tool image(s) are known hardened dfir/* images"
  ansible.builtin.command:
    argv: ["python3", "-m", "get_sybers_dfir.images", "--require", "{{ item }}"]
  environment:
    PYTHONPATH: "{{ dfir_volatility_python_path }}"
  loop:
    - "{{ dfir_volatility_image }}"
  register: dfir_volatility_image_guard
  changed_when: false
  when: item is match('^dfir/')
