---
- name: Verify
  hosts: localhost
  gather_facts: false
  vars:
    molecule_out: /tmp/dfir_plaso_molecule/out
  tasks:
    - name: "molecule-verify | find the dfir_plaso_produced enriched JSONL"
      ansible.builtin.find:
        paths: "{{ molecule_out }}/jsonl"
        patterns: "*.jsonl"
      register: dfir_plaso_produced

    - name: "molecule-verify | find the durable .plaso storage db"
      ansible.builtin.find:
        paths: "{{ molecule_out }}/plaso"
        patterns: "*.plaso"
      register: dfir_plaso_dbs

    - name: "molecule-verify | assert a timeline and its .plaso db exist"
      ansible.builtin.assert:
        that:
          - dfir_plaso_produced.matched | int > 0
          - dfir_plaso_dbs.matched | int > 0
        fail_msg: "no <host>.jsonl and/or .plaso db dfir_plaso_produced from the sample image"
        quiet: true
