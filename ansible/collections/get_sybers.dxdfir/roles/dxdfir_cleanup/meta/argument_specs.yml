---
argument_specs:
  main:
    short_description: "Wipe processed evidence, the CAR tree, or the get-sybers/* tool images."
    description:
      - >-
        Teardown for a re-run. Three actions (dxdfir_cleanup_action): processed
        (everything under data_store/processed, preserving .gitkeep), car (the
        materialised CAR tree), and docker (built get-sybers/* images — the hardened
        set by default, or every get-sybers/* with all_dxdfir; only images present on
        the host). The front-end confirms destructive runs and can pass --check
        for a dry run.
    options:
      dxdfir_cleanup_action:
        type: str
        required: false
        default: processed
        choices: [processed, car, docker]
        description: "Which teardown to run."
      dxdfir_cleanup_processed_dir:
        type: str
        required: false
        description: "Processed tree to wipe (default data_store/processed)."
      dxdfir_cleanup_car_dir:
        type: str
        required: false
        description: "CAR tree to wipe (default data_store/processed/byakugan)."
      dxdfir_cleanup_dangling:
        type: bool
        required: false
        default: false
        description: "docker: also prune dangling layers."
      dxdfir_cleanup_all_dxdfir:
        type: bool
        required: false
        default: false
        description: "docker: remove EVERY get-sybers/* image, not only the hardened tool set."
      dxdfir_cleanup_become:
        type: bool
        required: false
        default: false
        description: >-
          Escalate the destructive filesystem removal (the processed/car wipes)
          via per-task become: those trees hold lane output the containerised
          goTools wrote as a different uid (uid 2000), which the connection user
          cannot remove. The CLI sets this for the wipe actions and prompts once
          for the sudo password when not already root; the docker action never
          escalates. Mirrors dxdfir_stack_become.
