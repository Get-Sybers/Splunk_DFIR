---
argument_specs:
  main:
    short_description: "YARA / Suricata / Hayabusa detection lanes -> JSONL."
    description:
      - >-
        Runs the signature engines over the evidence and writes one <lane>/ folder of
        detection JSONL under the output dir. YARA runs over loose files, disk images
        (mounted read-only in place — needs /dev/fuse + ewfmount/ntfs-3g on the host;
        nothing is extracted) and memory images (Volatility 3 windows.vadyarascan);
        Suricata over PCAPs; Hayabusa over loose Windows Event Logs (disk-image EVTX
        flows through the evtx lane's targeted extraction). A source whose host
        prerequisites are missing notes it and produces nothing.
        Idempotent: a lane whose output already exists is skipped.
    options:
      dfir_signatures_pipeline:
        type: str
        required: false
        default: adx
        choices: [adx, sofelk]
        description: "Which backend to target; selects the output destination."
      dfir_signatures_adx_out_dir:
        type: str
        required: false
        description: "ADX-path output base (default data_store/processed/signatures)."
      dfir_signatures_sofelk_out_dir:
        type: str
        required: false
        description: "SOF-ELK-path output base (delivered into SOF-ELK by dfir_ingest_sofelk)."
      dfir_signatures_lanes:
        type: list
        elements: str
        required: false
        default: []
        description: "Lanes to run; empty = all. Any of: yara, suricata, hayabusa."
      dfir_signatures_fetch:
        type: bool
        required: false
        default: false
        description: "Provision rules when online: the YARA lane fetches the pinned DetectRaptor ruleset when it has no rules yet (sha256-verified, idempotent); other lanes note missing deps."
      dfir_signatures_python_path:
        type: str
        required: false
        description: "PYTHONPATH to the get_sybers_dfir package (in-repo/dev runs)."
      dfir_signatures_force:
        type: bool
        required: false
        default: false
        description: "Regenerate lane outputs that already exist."
