---
# FIND FACTS -> check existence AND location -> (then BUILD + DEPLOY + VERIFY).

- name: "deploy-sofelk-preflight | docker daemon reachable"
  ansible.builtin.command: docker version
  register: dxdfir_deploy_sofelk_docker
  changed_when: false

- name: "deploy-sofelk-preflight | docker compose plugin present"
  ansible.builtin.command: docker compose version
  register: dxdfir_deploy_sofelk_compose_v
  changed_when: false

- name: "deploy-sofelk-preflight | stat the compose file"
  ansible.builtin.stat:
    path: "{{ dxdfir_deploy_sofelk_compose_dir }}/docker-compose.yml"
  register: dxdfir_deploy_sofelk_compose_stat

- name: "deploy-sofelk-preflight | stat the Dockerfile"
  ansible.builtin.stat:
    path: "{{ dxdfir_deploy_sofelk_compose_dir }}/Dockerfile"
  register: dxdfir_deploy_sofelk_dockerfile_stat

- name: "deploy-sofelk-preflight | assert the compose file + Dockerfile are present"
  ansible.builtin.assert:
    that:
      - dxdfir_deploy_sofelk_compose_stat.stat.exists
      - dxdfir_deploy_sofelk_dockerfile_stat.stat.exists
    fail_msg: >-
      {{ dxdfir_deploy_sofelk_compose_dir }} has no docker-compose.yml / Dockerfile.
    quiet: true

- name: "deploy-sofelk-preflight | ensure the host ingest dir exists"
  ansible.builtin.file:
    path: "{{ dxdfir_deploy_sofelk_ingest_dir }}"
    state: directory
    mode: "0755"
