name: checks

# Runs everything that can be verified without Docker or evidence.
#
# What this DOES cover: shell syntax, shellcheck, repo-root path resolution,
# the shared container-lifecycle library's behaviour, Kusto schema and
# ingestion consistency, evidence gitignore coverage, secret patterns, and
# documentation links.
#
# What it does NOT cover: the pipeline. Nothing here processes a disk image,
# a PCAP, or an event log, and nothing starts the Kusto emulator. Those need a
# real host with Docker and real evidence — see the open issues tagged
# `needs-runtime`. A green tick here means the repository is internally
# consistent, not that the pipeline works.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The evidence-gitignore checks call `git check-ignore`, which needs
          # real git metadata rather than a tarball export.
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install check dependencies
        run: |
          set -euo pipefail
          # shellcheck ships on ubuntu-latest runners; install only if absent
          # so this still works on a self-hosted runner.
          #
          # Written as an if-block deliberately: `command -v x || a && b` parses
          # as `(command -v x || a) && b`, so the install runs even when the
          # tool is already present.
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq shellcheck
          fi
          python -m pip install --quiet --upgrade pip

      - name: Report tool versions
        run: |
          echo "bash        $(bash --version | head -1)"
          echo "shellcheck  $(shellcheck --version | grep version: | head -1)"
          echo "python      $(python --version)"

      - name: Run repository checks
        run: ./tests/run-checks.sh -v
