---
# dfir_lane: the shared "run a hardened DFIR tool lane" skeleton. A lane role
# (dfir_zeek, dfir_plaso, dfir_evtx, dfir_volatility, dfir_signatures,
# dfir_zimmerman) asserts its own input rules, builds its processor argv +
# gate/verify vars, then delegates preflight + process here — so the ~72-line
# skeleton that was copy-pasted six times lives once.
#
# The role GROUPS; the playbook DECIDES. Idempotence lives in each Python
# processor, not in a task's `when:`.

- name: "run preflight | {{ dfir_lane_name }}"
  ansible.builtin.include_tasks:
    file: preflight.yml
    apply:
      tags: [always]
  tags: [always]

- name: "run process | {{ dfir_lane_name }}"
  ansible.builtin.include_tasks: process.yml
