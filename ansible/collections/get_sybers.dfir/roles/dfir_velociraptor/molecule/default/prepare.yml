---
- name: Prepare
  hosts: localhost
  gather_facts: false
  vars:
    molecule_raw: /tmp/dfir_velociraptor_molecule/raw
    molecule_out: /tmp/dfir_velociraptor_molecule/out
  tasks:
    - name: "molecule-prepare | start from a clean output dir"
      ansible.builtin.file:
        path: "{{ molecule_out }}"
        state: absent

    - name: "molecule-prepare | collections dir exists"
      ansible.builtin.file:
        path: "{{ molecule_raw }}"
        state: directory
        mode: "0755"

    - name: "molecule-prepare | stage the fixture collection ZIP"
      ansible.builtin.copy:
        src: files/fixture.zip
        dest: "{{ molecule_raw }}/HOST01.zip"
        mode: "0644"
