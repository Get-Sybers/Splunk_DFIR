#############################################################################################
#                                        CSV                                               #
#############################################################################################
[set_host_from_csv]
DEST_KEY = MetaData:Host
SOURCE_KEY = field:hostname
FORMAT = host::$1
REGEX = (.*)
WRITE_META = true

[set_sourcetype_from_csv]
DEST_KEY   = MetaData:Sourcetype
SOURCE_KEY = field:source_long
FORMAT     = sourcetype::l2t:$1
REGEX = ([\w\-\_]+)\s?.*
WRITE_META = true

##################################### l2t:WinEVTX ###########################################
# extract_event_log_name and extract_event_id need some work to figure out if they are being indexed and the regex work. dynamic_field_extraction works for search time fields but not indexed time.
# dynamic_field_extraction also uses report in props. not sure if I have to use REPORT because it's a regex or if I can use EXTRACT. I think REPORT is the correct one to use.
[winevent_source_extraction]
REGEX=\\\\(?<winevent_source>[^\\\\]+)\\.evtx
FORMAT=winevent_source::$1
WRITE_META = true

[computer_name_extraction]
REGEX=Computer Name:\s(?<computer_name>[^,\s\n]+)
FORMAT=computer_name::$1
WRITE_META = true

[event_id_extraction]
REGEX=\[(?<event_id>\d+)\s
FORMAT=event_id::$1
WRITE_META = true

[provider_extraction]
REGEX=Source\sName:\s(?<provider>[^,]+)\sStrings:
FORMAT=provider::$1
WRITE_META = true

# ----- Winevent Logon Event 4624 -----
[subject_security_id_extraction]
REGEX = Subject:[\\\\tn]+Security\sID:[\\\\tn]+(?<subject_security_id>[^\\\\]+)
FORMAT = subject_security_id::$1
WRITE_META = true

[subject_account_name_extraction]
REGEX = Subject:.*?Account\sName:[\\\\tn]+(?<subject_account_name>[^\\\\]+)
FORMAT = subject_account_name::$1
WRITE_META = true

[subject_account_domain_extraction]
REGEX = Subject:.*?Account\sDomain:[\\\\tn]+(?<subject_account_domain>[^\\\\]+)
FORMAT = subject_account_domain::$1
WRITE_META = true

[subject_logon_id_extraction]
REGEX = Subject:.*?Logon\sID:[\\\\tn]+(?<subject_logon_id>[^\\\\]+)
FORMAT = subject_logon_id::$1
WRITE_META = true

[logon_type_extraction]
REGEX = Logon\sType:[^\d]+(?<logon_type>\d+)
FORMAT = logon_type::$1
WRITE_META = true

[impersonation_level_extraction]
REGEX = Impersonation\sLevel:[\\\\tn]+(?<impersonation_level>[^\\\\]+)
FORMAT = impersonation_level::$1
WRITE_META = true

[logon_security_id_extraction]
REGEX = New\sLogon:[\\\\tn]+Security\sID:[\\\\tn]+(?<logon_security_id>[^\\\\]+)
FORMAT = logon_security_id::$1
WRITE_META = true

[logon_account_name_extraction]
REGEX = New\sLogon:.*?Account\sName:[\\\\tn]+(?<logon_account_name>[^\\\\]+)
FORMAT = logon_account_name::$1
WRITE_META = true

[logon_account_domain_extraction]
REGEX = New\sLogon:.*?Account\sDomain:[\\\\tn]+(?<logon_account_domain>[^\\\\]+)
FORMAT = logon_account_domain::$1
WRITE_META = true

[logon_logon_id_extraction]
REGEX = New\sLogon:.*?Logon\sID:[\\\\tn]+(?<logon_logon_id>[^\\\\]+)
FORMAT = logon_logon_id::$1
WRITE_META = true

[logon_guid_extraction]
REGEX = Logon\sGUID:[\\\\tn]+(?<logon_guid>[^\\\\]+)
FORMAT = logon_guid::$1
WRITE_META = true

[process_id_extraction]
REGEX = Process\sInformation:[\\\\tn]+Process\sID:[\\\\tn]+(?<process_id>[^\\\\]+)
FORMAT = process_id::$1
WRITE_META = true

[process_name_extraction]
REGEX = Process\sInformation:.*?Process\sName:[\\\\tn]+(?<process_name>[:\\\\\w\d\-\_\s\%]+\.[^\\\\tn]+)
FORMAT = process_name::$1
WRITE_META = true

[workstation_name_extraction]
REGEX = Network\sInformation:[\\\\tn]+Workstation\sName:[\\\\tn]+(?<workstation_name>[^\\\\]+)
FORMAT = workstation_name::$1
WRITE_META = true

[source_network_address_extraction]
REGEX = Source\sNetwork\sAddress:[\\\\tn]+(?<source_network_address>[^\\\\]+)
FORMAT = source_network_address::$1
WRITE_META = true

[source_port_extraction]
REGEX = Source\sPort:[\\\\tn]+(?<source_port>[^\\\\]+)
FORMAT = source_port::$1
WRITE_META = true

[logon_process_extraction]
REGEX = Detailed\sAuthentication\sInformation:[\\\\tn]+Logon\sProcess:[\\\\tn]+(?<logon_process>[^\\\\]+)
FORMAT = logon_process::$1
WRITE_META = true

[auth_package_extraction]
REGEX = Authentication\sPackage:[\\\\tn]+(?<auth_package>[^\\\\]+)
FORMAT = auth_package::$1
WRITE_META = true

[transited_services_extraction]
REGEX = Transited\sServices:[\\\\tn]+(?<transited_services>[^\\\\]+)
FORMAT = transited_services::$1
WRITE_META = true

[package_name_extraction]
REGEX = Package\sName\s\(NTLM\sonly\):[\\\\tn]+(?<package_name>[^\\\\]+)
FORMAT = package_name::$1
WRITE_META = true

[key_length_extraction]
REGEX = Key\sLength:[\\\\tn]+(?<key_length>\d+)
FORMAT = key_length::$1
WRITE_META = true

[dynamic_field_extraction]
REGEX = (?<field_name>[A-Z][A-Za-z0-9\s]+):\s*(?<field_value>[^:\r\n]+?)(?=\s+[A-Z][A-Za-z0-9 ]+:|$)
FORMAT = $1::$2
MV_ADD = true