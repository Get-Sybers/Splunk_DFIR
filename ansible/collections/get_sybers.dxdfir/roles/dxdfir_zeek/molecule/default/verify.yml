---
- name: Verify
  hosts: localhost
  gather_facts: false
  vars:
    molecule_out: /tmp/dxdfir_zeek_molecule/out
  tasks:
    - name: "molecule-verify | find the dxdfir_zeek_produced Zeek JSON"
      ansible.builtin.find:
        paths: "{{ molecule_out }}"
        patterns: "*.json"
        recurse: true
      register: dxdfir_zeek_produced

    - name: "molecule-verify | assert Zeek dxdfir_zeek_produced a conn.json"
      ansible.builtin.assert:
        that:
          - dxdfir_zeek_produced.matched | int > 0
          - dxdfir_zeek_produced.files | map(attribute='path') | map('basename') | select('search', '^conn\\.json$') | list | length > 0
        fail_msg: "no conn.json dxdfir_zeek_produced from the fixture capture"
        quiet: true
