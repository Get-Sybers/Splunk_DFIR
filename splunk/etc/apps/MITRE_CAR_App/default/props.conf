#############################################################################
# Source field names -> MITRE CAR field names.
#
# This is the half that was missing. A data model with no field mapping
# returns rows of nulls, and Log2timeline_App carried a commented-out attempt
# at this (dated 20 April 2025) that would not have worked: it aliased to
# dotted names like `process.hostname`. FIELDALIAS creates a field literally
# called "process.hostname"; it does not place a field into a data model
# object. Objects are populated by tag (see eventtypes.conf / tags.conf), and
# their fields are ordinary flat fields. That is what this file produces.
#
# Rules followed here:
#   - Only fields that can be justified from the source's real output are
#     mapped. Nothing is invented to fill the model out.
#   - Where a source genuinely cannot supply a CAR field, it is left null.
#     A null is a true statement; a guess is not, and this is forensic data.
#   - `action` is CAR's verb. It is set with EVAL where the event identifies
#     one, and left unset where it does not.
#
# NONE OF THIS HAS BEEN RUN AGAINST A SPLUNK INSTANCE. See the app README.
#############################################################################


#############################################################################
# Zeek conn.log -> car_flow
#
# Field names are Zeek's own, as delivered by the operator-supplied
# Splunk_TA_zeek. Zeek writes `id.orig_h` etc.; the dots are part of the name,
# so they are single-quoted in EVAL expressions.
#############################################################################
[zeek:conn]
FIELDALIAS-car_flow = "id.orig_h" AS src_ip \
                      "id.orig_p" AS src_port \
                      "id.resp_h" AS dest_ip \
                      "id.resp_p" AS dest_port \
                      proto AS protocol

# conn.log has one row per completed connection: ts is the start, and duration
# is how long it lasted. end_time is only meaningful when duration is present.
EVAL-start_time = _time
EVAL-end_time   = if(isnotnull(duration), _time + duration, null())

# Zeek's conn_state distinguishes an established connection from a bare
# attempt. S0 = no reply seen, REJ = rejected — neither is a completed flow.
EVAL-action = case(
    'conn_state'=="SF", "end",
    'conn_state'=="S0", "start",
    'conn_state'=="REJ", "end",
    'conn_state'=="RSTO" OR 'conn_state'=="RSTR", "end",
    isnotnull('conn_state'), "message",
    1==1, null())

EVAL-packet_count = coalesce(orig_pkts, 0) + coalesce(resp_pkts, 0)
EVAL-hostname = host


#############################################################################
# EvtxECmd JSON -> car_user_session, car_process, car_service
#
# EvtxECmd's JSON puts the record's EventData in `Payload` as an XML fragment,
# and Map-extracted summary values in PayloadData1..6. The summary fields vary
# by map and are not dependable for a specific value, so the fields that
# matter are pulled out of Payload directly.
#
# The fragment looks like:
#     <Data Name="TargetUserName">jbadoino</Data>
# so these are anchored on the Name attribute and are unambiguous.
#############################################################################
[evtxecmd:json]
EXTRACT-car_target_user     = <Data Name="TargetUserName">(?<TargetUserName>[^<]*)</Data>
EXTRACT-car_target_domain   = <Data Name="TargetDomainName">(?<TargetDomainName>[^<]*)</Data>
EXTRACT-car_target_logon_id = <Data Name="TargetLogonId">(?<TargetLogonId>[^<]*)</Data>
EXTRACT-car_subject_user    = <Data Name="SubjectUserName">(?<SubjectUserName>[^<]*)</Data>
EXTRACT-car_subject_sid     = <Data Name="SubjectUserSid">(?<SubjectUserSid>[^<]*)</Data>
EXTRACT-car_logon_type      = <Data Name="LogonType">(?<LogonType>[^<]*)</Data>
EXTRACT-car_ip_address      = <Data Name="IpAddress">(?<IpAddress>[^<]*)</Data>
EXTRACT-car_ip_port         = <Data Name="IpPort">(?<IpPort>[^<]*)</Data>
EXTRACT-car_workstation     = <Data Name="WorkstationName">(?<WorkstationName>[^<]*)</Data>
EXTRACT-car_new_process     = <Data Name="NewProcessName">(?<NewProcessName>[^<]*)</Data>
EXTRACT-car_new_process_id  = <Data Name="NewProcessId">(?<NewProcessId>[^<]*)</Data>
EXTRACT-car_parent_process  = <Data Name="ParentProcessName">(?<ParentProcessName>[^<]*)</Data>
EXTRACT-car_process_cmdline = <Data Name="CommandLine">(?<ProcessCommandLine>[^<]*)</Data>
EXTRACT-car_service_name    = <Data Name="ServiceName">(?<ServiceName>[^<]*)</Data>
EXTRACT-car_service_image   = <Data Name="ImagePath">(?<ServiceImagePath>[^<]*)</Data>

# --- common ---------------------------------------------------------------
EVAL-hostname = Computer
EVAL-fqdn     = Computer

# --- user_session ---------------------------------------------------------
# TargetUserName is who the session is FOR. SubjectUserName is who requested
# it, which for an interactive logon is usually SYSTEM — so target first.
EVAL-user     = coalesce(TargetUserName, UserName, SubjectUserName)
EVAL-sid      = coalesce(UserId, SubjectUserSid)
EVAL-logon_id = TargetLogonId

# 4624's IpAddress is "-" for a local logon rather than absent.
EVAL-src_ip       = if(IpAddress=="-" OR IpAddress=="::1" OR IpAddress=="127.0.0.1", null(), IpAddress)
EVAL-src_port     = if(IpPort=="-" OR IpPort=="0", null(), IpPort)
EVAL-src_hostname = if(WorkstationName=="-", null(), WorkstationName)

# CAR's user_session actions. LogonType is the Windows logon type:
#   2 interactive, 3 network, 7 unlock, 10 RemoteInteractive (RDP).
EVAL-action = case(
    EventId==4634 OR EventId==4647, "logout",
    EventId==4778, "reconnect",
    EventId==4779, "remote",
    EventId==4624 AND LogonType==10, "rdp",
    EventId==4624 AND LogonType==7,  "unlock",
    EventId==4624 AND LogonType==2,  "interactive",
    EventId==4624 AND LogonType==3,  "remote",
    EventId==4624, "login",
    EventId==4625, "login",
    EventId==4688, "create",
    EventId==4689, "terminate",
    EventId==7045 OR EventId==4697, "create",
    1==1, null())

# --- process (4688 / 4689) ------------------------------------------------
# NewProcessId and ProcessId are hex in the event ("0x1a4"); tonumber(...,16)
# gives the decimal pid CAR expects. The strings keep their 0x prefix, so it
# is stripped first.
EVAL-exe               = NewProcessName
EVAL-image_path        = NewProcessName
EVAL-parent_exe        = ParentProcessName
EVAL-parent_image_path = ParentProcessName
EVAL-command_line      = ProcessCommandLine
EVAL-pid  = if(isnull(NewProcessId), null(), tonumber(replace(NewProcessId, "^0[xX]", ""), 16))
EVAL-ppid = if(isnull(ProcessId),    null(), tonumber(replace(ProcessId,    "^0[xX]", ""), 16))

# --- service (7045 / 4697) ------------------------------------------------
EVAL-name = ServiceName
# CAR's service object has no dedicated path field; image_path above already
# carries NewProcessName for 4688 and is null for 7045, so set it here only
# when a service image is present.
EVAL-module_path = ServiceImagePath


#############################################################################
# Plaso CSV -> car_file, car_process
#
# psteal --dynamic emits: datetime, timestamp_desc, source, source_long,
# message, parser, display_name, tag, and this project's set_host / set_sourcetype
# transforms derive host and a per-artefact sourcetype from them.
#
# Plaso is a timeline, not an event log: it tells you a file existed and when
# its MACB timestamps were set. It does not carry a pid, a command line or a
# parent. Those CAR fields are deliberately absent below rather than filled
# with something that looks like data.
#############################################################################
[l2t:csv]
EVAL-hostname = host
EVAL-user     = username

# display_name is Plaso's full path, e.g. TSK:/Windows/System32/cmd.exe.
# The volume prefix is stripped so file_path is a real path.
EVAL-file_path = replace(display_name, "^[A-Z0-9]+:", "")
EVAL-file_name = replace(replace(display_name, "^[A-Z0-9]+:", ""), "^.*[\\\\/]", "")

# timestamp_desc says WHICH timestamp this row represents. Only creation maps
# to a CAR action with any confidence; mtime is a modify, atime a read.
EVAL-action = case(
    match(timestamp_desc, "(?i)creation|crtime|birth"), "create",
    match(timestamp_desc, "(?i)content modification|mtime"), "modify",
    match(timestamp_desc, "(?i)last access|atime"), "read",
    match(timestamp_desc, "(?i)deletion|deleted"), "delete",
    1==1, null())

EVAL-creation_time = if(match(timestamp_desc, "(?i)creation|crtime|birth"), _time, null())


#############################################################################
# KAPE -> car_registry, car_file, car_process
#
# KAPE output is Eric Zimmerman's tool CSV/JSON, so field names differ per
# artefact. Only the names that are stable across his registry and file tools
# are mapped; anything artefact-specific belongs in Kape_App, not here.
#############################################################################
[kape:json:Registry]
EVAL-hostname = host
EVAL-key      = coalesce(KeyPath, Key)
EVAL-value    = coalesce(ValueName, Value)
EVAL-data     = ValueData
EVAL-hive     = coalesce(HiveName, HivePath)
EVAL-user     = coalesce(UserName, User)

[kape:csv:Registry]
EVAL-hostname = host
EVAL-key      = coalesce(KeyPath, Key)
EVAL-value    = coalesce(ValueName, Value)
EVAL-data     = ValueData
EVAL-hive     = coalesce(HiveName, HivePath)
EVAL-user     = coalesce(UserName, User)

[kape:json:ProgramExecution]
EVAL-hostname   = host
EVAL-exe        = coalesce(ExecutableName, ApplicationName, FileName)
EVAL-image_path = coalesce(FullPath, Path, ExecutablePath)
EVAL-action     = "create"

[kape:csv:ProgramExecution]
EVAL-hostname   = host
EVAL-exe        = coalesce(ExecutableName, ApplicationName, FileName)
EVAL-image_path = coalesce(FullPath, Path, ExecutablePath)
EVAL-action     = "create"

[kape:json:FileFolderAccess]
EVAL-hostname  = host
EVAL-file_name = coalesce(FileName, Name)
EVAL-file_path = coalesce(FullPath, Path)
EVAL-action    = "read"

[kape:csv:FileFolderAccess]
EVAL-hostname  = host
EVAL-file_name = coalesce(FileName, Name)
EVAL-file_path = coalesce(FullPath, Path)
EVAL-action    = "read"

[kape:json:FileDeletion]
EVAL-hostname  = host
EVAL-file_name = coalesce(FileName, Name)
EVAL-file_path = coalesce(FullPath, Path)
EVAL-action    = "delete"

[kape:csv:FileDeletion]
EVAL-hostname  = host
EVAL-file_name = coalesce(FileName, Name)
EVAL-file_path = coalesce(FullPath, Path)
EVAL-action    = "delete"
