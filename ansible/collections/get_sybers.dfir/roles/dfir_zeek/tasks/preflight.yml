---
# FIND FACTS -> check existence AND location -> (then adx/sofelk MODIFY + VERIFY).

- name: "zeek-preflight | docker daemon reachable"
  ansible.builtin.command: docker version
  register: dfir_zeek_docker
  changed_when: false

- name: "zeek-preflight | stat the pcap dir"
  ansible.builtin.stat:
    path: "{{ dfir_zeek_pcap_dir }}"
  register: dfir_zeek_pcap_stat

- name: "zeek-preflight | pcap dir exists and is a directory"
  ansible.builtin.assert:
    that:
      - dfir_zeek_pcap_stat.stat.exists
      - dfir_zeek_pcap_stat.stat.isdir is defined and dfir_zeek_pcap_stat.stat.isdir
    fail_msg: >-
      dfir_zeek_pcap_dir ({{ dfir_zeek_pcap_dir }}) is missing or is not a directory.
    quiet: true

- name: "zeek-preflight | the get_sybers_dfir.zeek module imports"
  ansible.builtin.command: python3 -c "import get_sybers_dfir.zeek"
  environment:
    PYTHONPATH: "{{ dfir_zeek_python_path }}"
  register: dfir_zeek_import
  changed_when: false

# Supply-chain guard: refuse to start unless the tool image about to run is a
# KNOWN hardened dfir/* image (label + uid 2000 + expected name). A substituted
# or un-hardened image stops the lane before any evidence is touched. A non-dfir
# image (operator-supplied .NET runtime) is out of scope and passes.
- name: "zeek-preflight | the tool image(s) are known hardened dfir/* images"
  ansible.builtin.command:
    argv: ["python3", "-m", "get_sybers_dfir.images", "--require", "{{ item }}"]
  environment:
    PYTHONPATH: "{{ dfir_zeek_python_path }}"
  loop:
    - "{{ dfir_zeek_image }}"
  register: dfir_zeek_image_guard
  changed_when: false
  when: item is match('^dfir/')
