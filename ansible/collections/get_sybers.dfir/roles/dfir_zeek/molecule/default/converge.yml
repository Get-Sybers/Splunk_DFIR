---
- name: Converge
  hosts: localhost
  gather_facts: true
  vars:
    dfir_zeek_pipeline: adx
    dfir_zeek_pcap_dir: /tmp/dfir_zeek_molecule/pcaps
    dfir_zeek_adx_out_dir: /tmp/dfir_zeek_molecule/out
  tasks:
    - name: "converge | run dfir_zeek (ADX)"
      ansible.builtin.include_role:
        name: dfir_zeek
